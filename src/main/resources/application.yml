spring:
  application:
    name: sitioguaratingueta
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  paths-to-match:
    - /api/v1/estoque/**
    - /api/v1/compras
    - /api/v1/compras/**
    - /api/v1/fornecedores
    - /api/v1/fornecedores/**
    - /api/v1/clima/**
    - /api/v1/admin/integracoes
    - /api/v1/tarefas/**
    - /api/v1/alertas/**
    - /api/v1/painel/**
    - /api/v1/criacoes/**
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      validate-group-membership: false
      show-details: when_authorized
      roles: ADMIN
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db
          show-details: never
    env:
      show-values: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      service.name: sitioguaratingueta
      service.environment: ${SITIOPRO_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}

info:
  app:
    name: Sítio Guaratinguetá
    version: ${SITIOPRO_APP_VERSION:0.0.1-SNAPSHOT}
    environment: ${SITIOPRO_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}

sitiopro:
  configuracao-operacional:
    inicial:
      nome-propriedade: ${SITIO_NOME_PROPRIEDADE:Sítio Guaratinguetá}
      timezone: ${SITIO_TIMEZONE:${sitiopro.integracoes.open-meteo.timezone:Etc/UTC}}
      latitude: ${SITIO_LATITUDE:${sitiopro.integracoes.open-meteo.latitude:}}
      longitude: ${SITIO_LONGITUDE:${sitiopro.integracoes.open-meteo.longitude:}}
      dias-padrao-incubacao: ${CRIACAO_AVES_GALINHA_INCUBACAO_DIAS:${sitiopro.criacoes.aves.periodos-incubacao-dias.GALINHA:21}}
      antecedencia-alerta-eclosao-dias: ${CRIACAO_AVES_ECLOSAO_PROXIMA_DIAS:${sitiopro.criacoes.aves.eclosao-proxima-dias:2}}
  criacoes:
    aves:
      mortalidade-alerta-percentual: ${CRIACAO_AVES_MORTALIDADE_ALERTA_PERCENTUAL:5.0}
      mortalidade-periodo-dias: ${CRIACAO_AVES_MORTALIDADE_PERIODO_DIAS:7}
      tarefas-automaticas-enabled: ${CRIACAO_AVES_TAREFAS_AUTOMATICAS_ENABLED:true}
      tarefa-verificacao-dias: ${CRIACAO_AVES_TAREFA_VERIFICACAO_DIAS:1}
      tarefa-ovoscopia-dias: ${CRIACAO_AVES_TAREFA_OVOSCOPIA_DIAS:7}
      tarefa-preparacao-antecedencia-dias: ${CRIACAO_AVES_TAREFA_PREPARACAO_ANTECEDENCIA_DIAS:3}
      pintinhos-recentes-dias: ${CRIACAO_AVES_PINTINHOS_RECENTES_DIAS:30}
  tarefas:
    scheduler-enabled: ${SITIOPRO_TASKS_SCHEDULER_ENABLED:true}
    alertas-intervalo: ${SITIOPRO_ALERTS_INTERVAL:PT5M}
    recorrencias-intervalo: ${SITIOPRO_TASK_RECURRENCES_INTERVAL:PT1M}
    scheduler-atraso-inicial: ${SITIOPRO_TASKS_INITIAL_DELAY:PT30S}
    lote-proximo-vencimento-dias: ${SITIOPRO_LOT_EXPIRY_WARNING_DAYS:30}
    chuva24h-limite-mm: ${SITIOPRO_RAIN_24H_ALERT_MM:50.0}
    recorrencias-limite-por-execucao: ${SITIOPRO_TASK_RECURRENCES_BATCH_SIZE:100}
  cache:
    clima-resumo-ttl: ${CACHE_TTL_CLIMA_RESUMO:5m}
    integracoes-status-ttl: ${CACHE_TTL_INTEGRACOES_STATUS:30s}
    agrofit-culturas-ttl: ${CACHE_TTL_AGROFIT_CULTURAS:12h}
    redis:
      enabled: ${REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      command-timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      retry-after: ${REDIS_RETRY_AFTER:10s}
  observability:
    service-name: sitioguaratingueta
    environment: ${SITIOPRO_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}
    enabled: ${SITIOPRO_OBSERVABILITY_ENABLED:false}
    apm-server-url: ${SITIOPRO_OBSERVABILITY_APM_SERVER_URL:http://apm-server:8200}
  integracoes:
    core:
      running-timeout: ${SITIOPRO_INTEGRATION_RUNNING_TIMEOUT:30m}
      history-limit: ${SITIOPRO_INTEGRATION_HISTORY_LIMIT:20}
      open-meteo-limit-per-minute: ${SITIOPRO_OPEN_METEO_LIMIT_PER_MINUTE:10}
      agrofit-limit-per-minute: ${SITIOPRO_AGROFIT_LIMIT_PER_MINUTE:2}
    open-meteo:
      enabled: ${SITIOPRO_OPEN_METEO_ENABLED:false}
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
      schedule-zone: ${SITIOPRO_INTEGRATIONS_ZONE:UTC}
      contexto: ${SITIOPRO_CLIMATE_CONTEXT:principal}
      cron: ${OPEN_METEO_CRON:0 17 */3 * * *}
      connect-timeout: ${OPEN_METEO_CONNECT_TIMEOUT:3s}
      read-timeout: ${OPEN_METEO_READ_TIMEOUT:8s}
      stale-after: ${OPEN_METEO_STALE_AFTER:6h}
      forecast-days: ${OPEN_METEO_FORECAST_DAYS:7}
      retention-days: ${OPEN_METEO_RETENTION_DAYS:30}
    embrapa-agrofit:
      enabled: ${SITIOPRO_EMBRAPA_AGROFIT_ENABLED:false}
      base-url: ${EMBRAPA_AGROFIT_BASE_URL:https://api.cnptia.embrapa.br/agrofit/v1}
      token: ${EMBRAPA_AGROFIT_TOKEN:}
      cron: ${EMBRAPA_AGROFIT_CRON:0 29 3 * * MON}
      schedule-zone: ${SITIOPRO_INTEGRATIONS_ZONE:UTC}
      connect-timeout: ${EMBRAPA_AGROFIT_CONNECT_TIMEOUT:3s}
      read-timeout: ${EMBRAPA_AGROFIT_READ_TIMEOUT:10s}
      stale-after: ${EMBRAPA_AGROFIT_STALE_AFTER:9d}
      max-pages: ${EMBRAPA_AGROFIT_MAX_PAGES:1}
