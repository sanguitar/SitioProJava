<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Registrar operação hídrica')}"></th:block><link rel="stylesheet" th:href="@{/css/agua.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-agua water-page"><div th:replace="~{fragments/ui :: topbar('Registrar operação', 'Água / Operação')}"></div><form class="water-panel water-form" th:action="@{/sitio/agua/registros}" th:object="${operacaoForm}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><input type="hidden" th:field="*{chaveIdempotencia}"><div class="water-form-grid"><div><label for="tipo">Operação</label><select id="tipo" class="form-select" th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t:${tiposOperacao}" th:value="${t}" th:text="${t.rotulo}"></option></select><div class="text-danger" th:errors="*{tipo}"></div></div><div><label for="data">Data e hora</label><input id="data" class="form-control" type="datetime-local" th:field="*{dataOperacao}" required><div class="text-danger" th:errors="*{dataOperacao}"></div></div><div><label for="origem">Recurso</label><select id="origem" class="form-select" th:field="*{recursoOrigemId}" required><option value="">Selecione</option><option th:each="r:${recursos}" th:value="${r.id}" th:text="${r.nome + ' · ' + (r.volumeConhecido ? r.volumeAtualLitros + ' L' : 'sem medição')}"></option></select><div class="text-danger" th:errors="*{recursoOrigemId}"></div></div><div><label for="destino">Destino</label><select id="destino" class="form-select" th:field="*{recursoDestinoId}"><option value="">Não se aplica</option><option th:each="r:${recursos}" th:value="${r.id}" th:text="${r.nome}"></option></select><small class="water-help">Obrigatório somente para transferência.</small></div><div><label for="quantidade">Volume (L)</label><input id="quantidade" class="form-control" type="number" min="0" step="0.001" th:field="*{quantidadeLitros}"><small class="water-help">Na medição, informe o volume atual. Em inspeção, deixe em branco.</small><div class="text-danger" th:errors="*{quantidadeLitros}"></div></div><div class="wide"><label for="observacao">Observação</label><textarea id="observacao" class="form-control" rows="3" maxlength="1000" th:field="*{observacao}"></textarea><div class="text-danger" th:errors="*{observacao}"></div></div></div><div class="water-form-actions"><a th:href="@{/sitio/agua}" class="btn btn-outline-dark">Cancelar</a><button class="btn btn-success" type="submit">Registrar</button></div></form><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
