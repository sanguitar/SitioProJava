<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Histórico da água')}"></th:block><link rel="stylesheet" th:href="@{/css/agua.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-agua water-page"><div th:replace="~{fragments/ui :: topbar('Histórico operacional', 'Água / Registros')}"></div><header class="water-heading"><div><small>AUDITORIA OPERACIONAL</small><h1>Registros de água</h1><p th:text="${pagina.totalElementos + ' operação(ões)'}">0 operações</p></div><div><a th:href="@{/sitio/agua/registros/novo}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Nova operação</a></div></header><section class="water-panel"><div class="table-responsive" th:if="${!#lists.isEmpty(pagina.conteudo)}"><table class="table align-middle"><thead><tr><th>Data</th><th>Operação</th><th>Origem</th><th>Destino</th><th>Volume</th><th>Responsável</th></tr></thead><tbody><tr th:each="o:${pagina.conteudo}"><td th:text="${#temporals.format(o.dataOperacao,'dd/MM/yyyy HH:mm')}">-</td><td th:text="${o.tipo.rotulo}">-</td><td><a th:href="@{/sitio/agua/recursos/{id}(id=${o.recursoOrigemId})}" th:text="${o.recursoOrigemNome}">-</a></td><td th:text="${o.recursoDestinoNome ?: '—'}">-</td><td th:text="${o.quantidadeLitros != null ? #numbers.formatDecimal(o.quantidadeLitros,1,'POINT',3,'COMMA') + ' L' : '—'}">-</td><td th:text="${o.criadoPor ?: 'sistema'}">-</td></tr></tbody></table></div><div class="empty-state-card compact" th:if="${#lists.isEmpty(pagina.conteudo)}"><i class="fa-solid fa-clock-rotate-left"></i><div><strong>Nenhuma operação registrada</strong><p>O histórico auditável aparecerá aqui.</p></div></div><nav th:if="${pagina.totalPaginas > 1}" class="d-flex justify-content-between"><a class="btn btn-outline-dark" th:classappend="${pagina.pagina == 0 ? ' disabled' : ''}" th:href="@{/sitio/agua/registros(pagina=${pagina.pagina - 1})}"><i class="fa-solid fa-arrow-left"></i></a><span th:text="${'Página ' + (pagina.pagina + 1) + ' de ' + pagina.totalPaginas}">Página</span><a class="btn btn-outline-dark" th:classappend="${pagina.pagina + 1 >= pagina.totalPaginas ? ' disabled' : ''}" th:href="@{/sitio/agua/registros(pagina=${pagina.pagina + 1})}"><i class="fa-solid fa-arrow-right"></i></a></nav></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
