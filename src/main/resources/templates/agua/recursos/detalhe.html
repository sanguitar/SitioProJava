<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead(${recurso.nome})}"></th:block><link rel="stylesheet" th:href="@{/css/agua.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-agua water-page"><div th:replace="~{fragments/ui :: topbar(${recurso.nome}, 'Água / Recurso')}"></div><header class="water-heading"><div><small th:text="${recurso.tipo.name().replace('_',' ')}">TIPO</small><h1 th:text="${recurso.nome}">Recurso</h1><p th:text="${recurso.observacao ?: 'Sem observação cadastrada'}">Observação</p></div><div><a th:href="@{/sitio/agua/reservatorios}" class="btn btn-outline-dark">Recursos</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/agua/recursos/{id}/configuracao(id=${recurso.id})}" class="btn btn-outline-dark"><i class="fa-solid fa-gear me-2"></i>Configurar</a><a th:href="@{/sitio/agua/registros/novo(recursoId=${recurso.id})}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Operação</a></div></header><div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div><section class="water-panel water-detail"><div><span>Volume atual</span><strong th:text="${recurso.volumeConhecido ? #numbers.formatDecimal(recurso.volumeAtualLitros,1,'POINT',3,'COMMA') + ' L' : 'Desconhecido'}">-</strong></div><div><span>Capacidade</span><strong th:text="${recurso.capacidadeLitros != null ? #numbers.formatDecimal(recurso.capacidadeLitros,1,'POINT',3,'COMMA') + ' L' : 'Não informada'}">-</strong></div><div><span>Limite mínimo</span><strong th:text="${recurso.nivelMinimoAlertaLitros != null ? #numbers.formatDecimal(recurso.nivelMinimoAlertaLitros,1,'POINT',3,'COMMA') + ' L' : 'Não disponível'}">-</strong></div><div><span>Última inspeção</span><strong th:text="${recurso.ultimaInspecao != null ? #temporals.format(recurso.ultimaInspecao,'dd/MM/yyyy HH:mm') : 'Não registrada'}">-</strong></div><div><span>Próxima inspeção</span><strong th:text="${recurso.proximaInspecao != null ? #temporals.format(recurso.proximaInspecao,'dd/MM/yyyy HH:mm') : 'Não programada'}">-</strong></div></section><section class="water-panel"><div class="water-panel-title"><h2>Histórico operacional</h2><span th:text="${operacoes.size() + ' registro(s)'}">0</span></div><div class="water-history"><article th:each="o:${operacoes}"><div><strong th:text="${o.tipo.rotulo}">Tipo</strong><time th:text="${#temporals.format(o.dataOperacao,'dd/MM/yyyy HH:mm')}">-</time></div><p th:if="${o.recursoDestinoNome != null}" th:text="${o.recursoOrigemNome + ' → ' + o.recursoDestinoNome}">Transferência</p><p th:if="${o.observacao}" th:text="${o.observacao}">Observação</p><small th:text="${o.quantidadeLitros != null ? #numbers.formatDecimal(o.quantidadeLitros,1,'POINT',3,'COMMA') + ' L' : 'Inspeção operacional'}">-</small></article><div class="empty-state-card compact" th:if="${#lists.isEmpty(operacoes)}"><i class="fa-solid fa-clock-rotate-left"></i><div><strong>Sem histórico operacional</strong><p>Registre a primeira medição ou inspeção.</p></div></div></div></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
