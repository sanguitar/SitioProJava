<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Recursos hídricos')}"></th:block><link rel="stylesheet" th:href="@{/css/agua.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-agua water-page"><div th:replace="~{fragments/ui :: topbar('Recursos hídricos', 'Água / Recursos')}"></div><header class="water-heading"><div><small>CADASTRO DA PROPRIEDADE</small><h1>Reservatórios e fontes</h1><p th:text="${recursos.size() + ' recurso(s) cadastrado(s)'}">0 recursos</p></div><div><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/propriedade/recursos-hidricos/novo}" class="btn btn-outline-dark"><i class="fa-solid fa-plus me-2"></i>Novo recurso</a><a th:href="@{/sitio/agua/registros/novo}" class="btn btn-success">Registrar operação</a></div></header><div class="water-grid"><a class="water-card" th:each="r:${recursos}" th:href="@{/sitio/agua/recursos/{id}(id=${r.id})}"><div><h2 th:text="${r.nome}">Recurso</h2><span class="status-badge" th:classappend="${!r.ativo ? 'status-planned' : (r.nivelBaixo ? 'status-review' : 'status-functional')}" th:text="${!r.ativo ? 'INATIVO' : (r.nivelBaixo ? 'NÍVEL BAIXO' : 'ATIVO')}">Ativo</span></div><p th:text="${r.tipo.name().replace('_',' ')}">Tipo</p><strong th:text="${r.volumeConhecido ? #numbers.formatDecimal(r.volumeAtualLitros,1,'POINT',3,'COMMA') + ' L' : 'Sem medição'}">-</strong><small th:if="${r.capacidadeLitros != null}" th:text="${'Capacidade ' + #numbers.formatDecimal(r.capacidadeLitros,1,'POINT',3,'COMMA') + ' L'}">-</small></a><div class="empty-state-card compact" th:if="${#lists.isEmpty(recursos)}"><i class="fa-solid fa-droplet"></i><div><strong>Nenhum recurso hídrico</strong><p>O cadastro é realizado em Propriedade.</p></div></div></div><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
