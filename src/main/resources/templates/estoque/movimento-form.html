<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Nova Movimentação')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/estoque.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>
    <main class="main-content main-content-wide estoque-page domain-estoque">
        <div th:replace="~{fragments/ui :: topbar('Nova movimentação', 'Estoque')}"></div>
        <div class="page-heading">
            <div>
                <small class="module-group">Estoque</small>
                <h1>Nova movimentação</h1>
            </div>
            <a th:href="@{/sitio/estoque/movimentacoes}" class="btn btn-outline-dark">
                <i class="fa-solid fa-arrow-left me-2"></i>Histórico
            </a>
        </div>
        <div th:replace="~{estoque/fragments :: tabs('movimentacoes')}"></div>

        <section class="estoque-panel">
            <form th:action="@{/sitio/estoque/movimentacoes}" th:object="${movimentoForm}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                <div class="col-md-5">
                    <label class="form-label" for="itemId">Item</label>
                    <select id="itemId" th:field="*{itemId}" class="form-select" required>
                        <option value="">Selecione</option>
                        <option th:each="item : ${itens}" th:value="${item.id}" th:text="${item.nome + ' (' + item.unidadeMedida.sigla + ')'}">Item</option>
                    </select>
                    <div class="text-danger small" th:errors="*{itemId}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="tipo">Tipo</label>
                    <select id="tipo" th:field="*{tipo}" class="form-select" required>
                        <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.rotulo}">Tipo</option>
                    </select>
                    <div class="text-danger small" th:errors="*{tipo}"></div>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="quantidade">Quantidade</label>
                    <input id="quantidade" type="number" step="0.0001" min="0.0001" th:field="*{quantidade}" class="form-control" required>
                    <div class="text-danger small" th:errors="*{quantidade}"></div>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="dataMovimento">Data</label>
                    <input id="dataMovimento" type="datetime-local" th:field="*{dataMovimento}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="localOrigemId">Local de origem</label>
                    <select id="localOrigemId" th:field="*{localOrigemId}" class="form-select">
                        <option value="">Sem origem</option>
                        <option th:each="local : ${locais}" th:value="${local.id}" th:text="${local.nome}">Local</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="localDestinoId">Local de destino</label>
                    <select id="localDestinoId" th:field="*{localDestinoId}" class="form-select">
                        <option value="">Sem destino</option>
                        <option th:each="local : ${locais}" th:value="${local.id}" th:text="${local.nome}">Local</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="loteCodigo">Lote</label>
                    <input id="loteCodigo" type="text" th:field="*{loteCodigo}" class="form-control" maxlength="80">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="validade">Validade</label>
                    <input id="validade" type="date" th:field="*{validade}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="custoUnitario">Custo unitário</label>
                    <input id="custoUnitario" type="number" step="0.0001" min="0" th:field="*{custoUnitario}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="custoTotal">Custo total</label>
                    <input id="custoTotal" type="number" step="0.0001" min="0" th:field="*{custoTotal}" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label" for="observacao">Observação</label>
                    <textarea id="observacao" th:field="*{observacao}" class="form-control" rows="3" maxlength="500"></textarea>
                    <div class="text-danger small" th:errors="*{observacao}"></div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/sitio/estoque/movimentacoes}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-check me-2"></i>Registrar
                    </button>
                </div>
            </form>
        </section>
        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>
    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
