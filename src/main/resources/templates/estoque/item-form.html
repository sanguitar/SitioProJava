<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Novo Item')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/estoque.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>
    <main class="main-content main-content-wide estoque-page domain-estoque">
        <div th:replace="~{fragments/ui :: topbar('Novo item', 'Estoque')}"></div>
        <div class="page-heading">
            <div>
                <small class="module-group">Estoque</small>
                <h1>Novo item</h1>
            </div>
            <a th:href="@{/sitio/estoque/itens}" class="btn btn-outline-dark">
                <i class="fa-solid fa-arrow-left me-2"></i>Voltar
            </a>
        </div>
        <div th:replace="~{estoque/fragments :: tabs('itens')}"></div>

        <section class="estoque-panel">
            <form th:action="@{/sitio/estoque/itens}" th:object="${itemForm}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                <div class="col-md-7">
                    <label class="form-label" for="nome">Nome</label>
                    <input id="nome" type="text" th:field="*{nome}" class="form-control" maxlength="140" required>
                    <div class="text-danger small" th:errors="*{nome}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="categoriaId">Categoria</label>
                    <select id="categoriaId" th:field="*{categoriaId}" class="form-select" required>
                        <option value="">Selecione</option>
                        <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}">Categoria</option>
                    </select>
                    <div class="text-danger small" th:errors="*{categoriaId}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="unidadeMedidaId">Unidade</label>
                    <select id="unidadeMedidaId" th:field="*{unidadeMedidaId}" class="form-select" required>
                        <option value="">Selecione</option>
                        <option th:each="unidade : ${unidades}" th:value="${unidade.id}" th:text="${unidade.nome + ' (' + unidade.sigla + ')'}">Unidade</option>
                    </select>
                    <div class="text-danger small" th:errors="*{unidadeMedidaId}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="estoqueMinimo">Estoque mínimo</label>
                    <input id="estoqueMinimo" type="number" step="0.0001" min="0" th:field="*{estoqueMinimo}" class="form-control">
                    <div class="text-danger small" th:errors="*{estoqueMinimo}"></div>
                </div>
                <div class="col-md-4 estoque-checks">
                    <label class="form-label d-block">Controles</label>
                    <label class="form-check">
                        <input type="checkbox" th:field="*{ativo}" class="form-check-input">
                        <span class="form-check-label">Ativo</span>
                    </label>
                    <label class="form-check">
                        <input type="checkbox" th:field="*{controlaLote}" class="form-check-input">
                        <span class="form-check-label">Lote</span>
                    </label>
                    <label class="form-check">
                        <input type="checkbox" th:field="*{controlaValidade}" class="form-check-input">
                        <span class="form-check-label">Validade</span>
                    </label>
                </div>
                <div class="col-12">
                    <label class="form-label" for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="3" maxlength="500"></textarea>
                    <div class="text-danger small" th:errors="*{descricao}"></div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/sitio/estoque/itens}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Salvar item
                    </button>
                </div>
            </form>
        </section>
        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>
    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
