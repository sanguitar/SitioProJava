<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Movimentações')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/estoque.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>
    <main class="main-content main-content-wide estoque-page domain-estoque">
        <div th:replace="~{fragments/ui :: topbar('Movimentações', 'Estoque')}"></div>
        <div class="page-heading">
            <div>
                <small class="module-group">Estoque</small>
                <h1>Movimentações</h1>
            </div>
            <a th:href="@{/sitio/estoque/movimentacoes/nova}" class="btn btn-success">
                <i class="fa-solid fa-plus me-2"></i>Nova movimentação
            </a>
        </div>
        <div th:replace="~{estoque/fragments :: tabs('movimentacoes')}"></div>
        <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>

        <section class="table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Item</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th>Origem</th>
                            <th>Destino</th>
                            <th>Lote</th>
                            <th>Usuário</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="movimento : ${pagina.conteudo}">
                            <td th:text="${#temporals.format(movimento.dataMovimento, 'dd/MM/yyyy HH:mm')}">-</td>
                            <td th:text="${movimento.itemNome}">Item</td>
                            <td><span class="badge bg-dark" th:text="${movimento.tipoRotulo}">Tipo</span></td>
                            <td>
                                <strong th:text="${#numbers.formatDecimal(movimento.quantidade, 1, 'POINT', 2, 'COMMA')}">0</strong>
                                <span th:text="${movimento.unidade}">UN</span>
                            </td>
                            <td th:text="${movimento.localOrigem ?: '-'}">-</td>
                            <td th:text="${movimento.localDestino ?: '-'}">-</td>
                            <td th:text="${movimento.loteCodigo ?: '-'}">-</td>
                            <td th:text="${movimento.criadoPor ?: '-'}">-</td>
                            <td class="text-end">
                                <a th:href="@{/sitio/estoque/movimentacoes/{id}(id=${movimento.id})}" class="btn-edit"
                                   title="Detalhar" aria-label="Detalhar movimentação">
                                    <i class="fa-solid fa-circle-info"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pagina.conteudo)}">
                            <td colspan="9">
                                <div class="empty-state-card">
                                    <i class="fa-solid fa-clock"></i>
                                    <div>
                                        <strong>Nenhuma movimentação</strong>
                                        <p>Registre uma entrada para iniciar o histórico do estoque.</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <nav class="mt-3" aria-label="Paginação do histórico" th:if="${pagina.totalPaginas > 1}">
            <ul class="pagination justify-content-center align-items-center mb-0">
                <li class="page-item" th:if="${pagina.pagina > 0}">
                    <a class="page-link"
                       th:href="@{/sitio/estoque/movimentacoes(page=${pagina.pagina - 1},size=${pagina.tamanho})}">Anterior</a>
                </li>
                <li class="page-item disabled" th:unless="${pagina.pagina > 0}">
                    <span class="page-link">Anterior</span>
                </li>
                <li class="page-item disabled">
                    <span class="page-link"
                          th:text="${'Página ' + (pagina.pagina + 1) + ' de ' + pagina.totalPaginas}">Página 1 de 1</span>
                </li>
                <li class="page-item" th:if="${pagina.pagina + 1 < pagina.totalPaginas}">
                    <a class="page-link"
                       th:href="@{/sitio/estoque/movimentacoes(page=${pagina.pagina + 1},size=${pagina.tamanho})}">Próxima</a>
                </li>
                <li class="page-item disabled" th:unless="${pagina.pagina + 1 < pagina.totalPaginas}">
                    <span class="page-link">Próxima</span>
                </li>
            </ul>
        </nav>
        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>
    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
