<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Abastecimento')}"></th:block><link rel="stylesheet" th:href="@{/css/abastecimento.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar('abastecimento')}"></aside><main class="main-content main-content-wide"><div th:replace="~{fragments/ui :: topbar('Detalhe do abastecimento', 'Veículos')}"></div>
<div class="page-heading"><div><a th:href="@{/sitio/abastecimentos}">Abastecimentos</a><h1 th:text="${abastecimento.veiculoNome}"></h1></div></div><dl class="detail-grid"><div><dt>Data</dt><dd th:text="${#temporals.format(abastecimento.data,'dd/MM/yyyy')}"></dd></div><div><dt>Litros</dt><dd th:text="${#numbers.formatDecimal(abastecimento.litros,1,3)}"></dd></div><div><dt>Preço por litro</dt><dd th:text="${'R$ ' + #numbers.formatDecimal(abastecimento.precoPorLitro,1,'POINT',4,'COMMA')}"></dd></div><div><dt>Valor total</dt><dd th:text="${'R$ ' + #numbers.formatDecimal(abastecimento.valorTotal,1,'POINT',2,'COMMA')}"></dd></div><div><dt>Leitura</dt><dd th:text="${abastecimento.leitura != null ? #numbers.formatDecimal(abastecimento.leitura,1,2) + ' ' + abastecimento.tipoMedidor.unidade : '—'}"></dd></div><div><dt>Local</dt><dd th:text="${abastecimento.local}"></dd></div><div><dt>Registrado por</dt><dd th:text="${abastecimento.criadoPor != null ? abastecimento.criadoPor : '—'}"></dd></div></dl>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
