<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Abastecimento')}"></th:block><link rel="stylesheet" th:href="@{/css/abastecimento.css}"></head>
<body><aside th:replace="~{fragments/sidebar :: sidebar('abastecimento')}"></aside><main class="main-content main-content-wide">
    <div th:replace="~{fragments/ui :: topbar('Novo abastecimento', 'Veículos')}"></div>
    <nav aria-label="breadcrumb" class="module-breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a th:href="@{/sitio/painel}">Início</a></li><li class="breadcrumb-item"><a th:href="@{/sitio/abastecimentos}">Abastecimentos</a></li><li class="breadcrumb-item active">Novo</li></ol></nav>
    <section class="card abastecimento-card"><div class="card-body p-4"><h1 class="h4 mb-4"><i class="fa-solid fa-gas-pump me-2"></i>Registrar abastecimento</h1>
        <form th:action="@{/sitio/abastecimento/salvar}" th:object="${abastecimentoForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}">
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Veículo</label><select id="veiculo" th:field="*{veiculoId}" class="form-select" required><option value="">Selecione</option><option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.nome}" th:data-medidor="${v.tipoMedidor}"></option></select></div>
                <div class="col-md-6"><label class="form-label">Data</label><input type="date" th:field="*{data}" class="form-control" required></div>
                <div class="col-md-3"><label class="form-label">Litros</label><input type="number" step="0.001" min="0.001" th:field="*{litros}" class="form-control" data-litros required></div>
                <div class="col-md-3"><label class="form-label">Preço por litro</label><input type="number" step="0.0001" min="0.0001" th:field="*{precoPorLitro}" class="form-control" data-preco required></div>
                <div class="col-md-3" data-km-group><label class="form-label">Hodômetro</label><input type="number" step="0.01" min="0" th:field="*{kmNoAto}" class="form-control"></div>
                <div class="col-md-3" data-horimetro-group><label class="form-label">Horímetro</label><input type="number" step="0.01" min="0" th:field="*{horimetroNoAto}" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Local</label><input type="text" th:field="*{local}" class="form-control" maxlength="255" required></div>
                <div class="col-md-6"><label class="form-label">Total estimado</label><div class="total-preview form-control" data-total-preview>R$ 0,00</div></div>
            </div>
            <div class="form-actions mt-4"><a th:href="@{/sitio/abastecimentos}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk me-2"></i>Registrar</button></div>
        </form>
    </div></section><div th:replace="~{fragments/ui :: appFooter}"></div>
</main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block><script th:src="@{/js/abastecimento.js}"></script></body></html>
