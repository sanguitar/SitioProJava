<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Abastecimentos')}"></th:block><link rel="stylesheet" th:href="@{/css/abastecimento.css}"></head><body>
<aside th:replace="~{fragments/sidebar :: sidebar('abastecimento')}"></aside><main class="main-content main-content-wide"><div th:replace="~{fragments/ui :: topbar('Histórico de abastecimentos', 'Veículos')}"></div>
<div class="page-heading"><h1><i class="fa-solid fa-gas-pump me-2"></i>Abastecimentos</h1><a th:href="@{/sitio/abastecimentos/novo}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Novo</a></div>
<form method="get" class="module-filterbar"><label for="veiculoId">Veículo</label><select id="veiculoId" name="veiculoId" class="form-select"><option value="">Todos</option><option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.nome}" th:selected="${v.id == veiculoId}"></option></select><button class="btn btn-outline-secondary" type="submit">Filtrar</button></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Data</th><th>Veículo</th><th>Litros</th><th>Preço/l</th><th>Total</th><th>Leitura</th><th>Local</th><th></th></tr></thead><tbody><tr th:each="a : ${pagina.conteudo}"><td th:text="${#temporals.format(a.data,'dd/MM/yyyy')}"></td><td th:text="${a.veiculoNome}"></td><td th:text="${#numbers.formatDecimal(a.litros,1,3)}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(a.precoPorLitro,1,'POINT',4,'COMMA')}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(a.valorTotal,1,'POINT',2,'COMMA')}"></td><td th:text="${a.leitura != null ? #numbers.formatDecimal(a.leitura,1,2) + ' ' + a.tipoMedidor.unidade : '—'}"></td><td th:text="${a.local}"></td><td><a th:href="@{/sitio/abastecimentos/{id}(id=${a.id})}" aria-label="Detalhes"><i class="fa-solid fa-arrow-right"></i></a></td></tr><tr th:if="${#lists.isEmpty(pagina.conteudo)}"><td colspan="8">Nenhum abastecimento encontrado.</td></tr></tbody></table></div>
<nav th:if="${pagina.totalPaginas > 1}" class="d-flex justify-content-between"><a class="btn btn-outline-secondary" th:classappend="${pagina.pagina == 0} ? disabled" th:href="@{/sitio/abastecimentos(pagina=${pagina.pagina - 1},veiculoId=${veiculoId})}">Anterior</a><span th:text="${'Página ' + (pagina.pagina + 1) + ' de ' + pagina.totalPaginas}"></span><a class="btn btn-outline-secondary" th:classappend="${pagina.pagina + 1 >= pagina.totalPaginas} ? disabled" th:href="@{/sitio/abastecimentos(pagina=${pagina.pagina + 1},veiculoId=${veiculoId})}">Próxima</a></nav>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
