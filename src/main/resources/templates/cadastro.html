<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sítio PRO - Gerenciar Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --agro-dark: #1e3d1a;
            --sidebar-width: 260px;
        }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            background: #212529;
            border-right: 4px solid var(--agro-dark);
            color: white;
            padding-top: 20px;
        }
        .sidebar-link {
            padding: 15px 25px;
            display: block;
            color: #adb5bd;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar-link:hover { background: var(--agro-dark); color: white; }
        .sidebar-link.active { background: var(--agro-dark); color: white; border-left: 5px solid #8dbd31; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; }
        
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header-agro { 
            background: #212529; 
            color: white; 
            border-bottom: 4px solid var(--agro-dark);
        }
        .btn-save { background: var(--agro-dark); color: white; border: none; padding: 12px; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #2d5a27; color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .form-label { color: var(--agro-dark); font-weight: 600; }
        .form-control:focus, .form-select:focus { border-color: var(--agro-dark); box-shadow: 0 0 0 0.25rem rgba(30, 61, 26, 0.25); }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <div class="px-4 mb-4">
            <h4 class="fw-bold"><i class="fa-solid fa-tractor me-2 text-success"></i>SÍTIO PRO</h4>
            <small class="text-muted">Gestão Operacional</small>
        </div>
        <a th:href="@{/sitio/painel}" class="sidebar-link"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a>
        <a th:href="@{/sitio/cadastro}" class="sidebar-link active"><i class="fa-solid fa-plus-circle me-2"></i> Novo Cadastro</a>
        <a th:href="@{/sitio/configuracoes}" class="sidebar-link"><i class="fa-solid fa-gears me-2"></i> Configurações</a>
    </div>

    <div class="main-content">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="card card-custom">
                    <div class="header-agro p-4">
                        <h3 class="mb-0 text-center">
                            <i th:class="${producao.id == null} ? 'fa-solid fa-plus-circle' : 'fa-solid fa-pen-to-square'"></i>
                            <span th:text="${producao.id == null ? ' Novo Cadastro Rural' : ' Atualizar Registro'}"></span>
                        </h3>
                    </div>
                    
                    <div class="card-body p-5 bg-white">
                        <form th:action="@{/sitio/salvar}" th:object="${producao}" method="post">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label class="form-label">Categoria do Recurso</label>
                                    <select th:field="*{categoria}" class="form-select form-select-lg" required>
                                        <option value="">-- Selecione a Categoria --</option>
                                        <option th:each="cat : ${categorias}" 
                                                th:value="${cat.id}" 
                                                th:text="${cat.nome}"></option>
                                    </select>
                                    <small class="text-muted"><i class="fa-solid fa-circle-info me-1"></i>Obrigatório para o gráfico e organização.</small>
                                </div>
                                
                                <div class="col-md-6 mb-4">
                                    <label class="form-label">Nome / Descrição do Item</label>
                                    <input type="text" th:field="*{item}" class="form-control form-control-lg" placeholder="Ex: Milho Grão" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-4">
                                    <label class="form-label">Quantidade Atual</label>
                                    <input type="number" th:field="*{quantidade}" class="form-control form-control-lg" step="0.01" min="0" required>
                                </div>
                                <div class="col-md-4 mb-4">
                                    <label class="form-label">Unidade de Medida</label>
                                    <input type="text" th:field="*{unidade}" class="form-control form-control-lg" placeholder="Ex: kg, saca, L" required>
                                </div>
                                <div class="col-md-4 mb-4">
                                    <label class="form-label">Status do Ativo</label>
                                    <select th:field="*{status}" class="form-select form-select-lg">
                                        <option value="Estoque">Estoque OK</option>
                                        <option value="Estoque Baixo">Estoque Baixo</option>
                                        <option value="Necessário comprar">Necessário comprar</option>
                                        <option value="Operacional">Operacional</option>
                                        <option value="Manutenção">Em Manutenção</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center mt-5">
                                <a th:href="@{/sitio/painel}" class="text-decoration-none text-muted fw-bold">
                                    <i class="fa-solid fa-arrow-left me-1"></i> Voltar ao Painel
                                </a>
                                <div class="d-flex gap-3">
                                    <button type="reset" class="btn btn-light px-4 border">Limpar</button>
                                    <button type="submit" class="btn btn-save px-5 shadow">
                                        <i class="fa-solid fa-cloud-arrow-up me-2"></i> SALVAR NO BANCO
                                    </button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
                
                <p class="text-center mt-4 text-muted small">Systems Analyst - Porto Velho/RO &copy; 2026</p>
            </div>
        </div>
    </div>

</body>
</html>
