<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Usuários')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>

    <main class="main-content main-content-wide">
        <div class="page-heading">
            <div>
                <small class="module-group">Administração</small>
                <h1>Usuários</h1>
            </div>
            <a th:href="@{/sitio/admin/usuarios/novo}" class="btn btn-success">
                <i class="fa-solid fa-user-plus me-2"></i>Novo usuário
            </a>
        </div>

        <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

        <section class="table-container">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Login</th>
                            <th>Perfil</th>
                            <th>Status</th>
                            <th>Criado em</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td class="fw-bold" th:text="${usuario.nome}">Nome</td>
                            <td th:text="${usuario.login}">login</td>
                            <td>
                                <span class="badge bg-dark" th:text="${usuario.perfil.rotulo}">Perfil</span>
                            </td>
                            <td>
                                <span th:if="${usuario.ativo}" class="badge bg-success-subtle text-success">Ativo</span>
                                <span th:unless="${usuario.ativo}" class="badge bg-secondary-subtle text-secondary">Inativo</span>
                            </td>
                            <td th:text="${usuario.criadoEm != null ? #temporals.format(usuario.criadoEm, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                            <td class="text-end">
                                <a th:href="@{/sitio/admin/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-outline-dark btn-sm">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a th:href="@{/sitio/admin/usuarios/{id}/senha(id=${usuario.id})}" class="btn btn-outline-primary btn-sm">
                                    <i class="fa-solid fa-key"></i>
                                </a>
                                <form th:if="${usuario.ativo}" th:action="@{/sitio/admin/usuarios/{id}/desativar(id=${usuario.id})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-warning btn-sm" data-confirm-message="Desativar usuário?">
                                        <i class="fa-solid fa-user-slash"></i>
                                    </button>
                                </form>
                                <form th:unless="${usuario.ativo}" th:action="@{/sitio/admin/usuarios/{id}/ativar(id=${usuario.id})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-success btn-sm">
                                        <i class="fa-solid fa-user-check"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
