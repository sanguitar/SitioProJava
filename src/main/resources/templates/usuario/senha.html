<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Reset de senha')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>

    <main class="main-content main-content-wide">
        <section class="user-form-panel">
            <div class="panel-heading">
                <div>
                    <h1>Reset de senha</h1>
                    <p class="text-muted mb-0" th:text="${usuario.nome}">Usuário</p>
                </div>
                <a th:href="@{/sitio/admin/usuarios}" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i>Voltar
                </a>
            </div>

            <form th:action="@{/sitio/admin/usuarios/{id}/senha(id=${usuario.id})}" th:object="${senhaForm}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

                <div class="col-md-6">
                    <label class="form-label">Nova senha</label>
                    <input type="password" th:field="*{novaSenha}" class="form-control" autocomplete="new-password" required>
                    <div class="text-danger small" th:errors="*{novaSenha}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirmar senha</label>
                    <input type="password" th:field="*{confirmarSenha}" class="form-control" autocomplete="new-password" required>
                    <div class="text-danger small" th:errors="*{confirmarSenha}"></div>
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fa-solid fa-key me-2"></i>Atualizar senha
                    </button>
                </div>
            </form>
        </section>

        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
