<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Plano preventivo')}"></th:block><link rel="stylesheet" th:href="@{/css/manutencao.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-manutencao maintenance-page"><div th:replace="~{fragments/ui :: topbar('Plano preventivo', 'Manutenção / Ativos')}"></div>
<header class="maintenance-heading"><div><small th:text="${ativo.codigo}">PAT</small><h1 th:text="${planoId == null ? 'Novo plano preventivo' : 'Editar plano preventivo'}">Plano preventivo</h1><p th:text="${ativo.nome}">Ativo</p></div><a th:href="@{/sitio/manutencao/ativos/{id}(id=${ativo.id})}" class="btn btn-outline-dark">Voltar</a></header>
<form th:action="${planoId == null ? '/sitio/manutencao/planos' : '/sitio/manutencao/planos/' + planoId}" th:object="${planoForm}" method="post" class="maintenance-panel maintenance-form"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{ativoId}"><input type="hidden" th:field="*{chaveIdempotencia}"><input type="hidden" th:field="*{versao}"><section><h2>Periodicidade</h2><div class="form-grid"><label>Nome<input th:field="*{nome}" maxlength="160" class="form-control" required></label><label>Medidor<select th:field="*{tipoPeriodicidade}" class="form-select" required><option value="">Selecione</option><option th:each="t:${periodicidades}" th:value="${t}" th:text="${t.rotulo}"></option></select></label><label>Intervalo<input type="number" min="0.01" step="0.01" th:field="*{intervalo}" class="form-control" required><small>Use dias inteiros, horas de operação ou quilômetros.</small></label><label>Data de referência<input type="datetime-local" th:field="*{dataReferencia}" class="form-control"><small>Usada somente para planos por dias.</small></label><label class="wide">Descrição<textarea th:field="*{descricao}" maxlength="500" rows="3" class="form-control"></textarea></label></div></section><div class="form-actions"><a th:href="@{/sitio/manutencao/ativos/{id}(id=${ativo.id})}" class="btn btn-outline-dark">Cancelar</a><button class="btn btn-success">Salvar plano</button></div></form><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
