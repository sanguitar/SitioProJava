<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead(${ativoId == null ? 'Novo ativo' : 'Editar ativo'})}"></th:block><link rel="stylesheet" th:href="@{/css/manutencao.css}"><link rel="stylesheet" th:href="@{/css/patrimonio.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-patrimonio maintenance-page"><div th:replace="~{fragments/ui :: topbar(${ativoId == null ? 'Novo ativo' : 'Editar ativo'}, 'Propriedade / Patrimônio')}"></div>
<header class="maintenance-heading"><div><small>CADASTRO PATRIMONIAL</small><h1 th:text="${ativoId == null ? 'Novo ativo' : 'Editar ativo'}">Ativo</h1><p>O código PAT é gerado automaticamente e não pode ser informado manualmente.</p></div><a th:href="${ativoId == null ? '/sitio/manutencao/ativos' : '/sitio/manutencao/ativos/' + ativoId}" class="btn btn-outline-dark">Voltar</a></header>
<form th:action="${ativoId == null ? '/sitio/manutencao/ativos' : '/sitio/manutencao/ativos/' + ativoId}" th:object="${ativoForm}" method="post" class="maintenance-panel maintenance-form"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{chaveIdempotencia}"><input type="hidden" th:field="*{versao}">
<section><h2>Identificação</h2><div class="form-grid"><label class="wide">Nome<input th:field="*{nome}" maxlength="160" class="form-control" required></label><label>Tipo<select th:field="*{tipo}" class="form-select" required><option value="">Selecione</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select></label><label>Status<select th:field="*{status}" class="form-select" required><option th:each="s:${statusAtivo}" th:value="${s}" th:text="${s.rotulo}"></option></select></label><label>Marca<input th:field="*{marca}" maxlength="100" class="form-control"></label><label>Modelo<input th:field="*{modelo}" maxlength="100" class="form-control"></label><label>Número de série<input th:field="*{numeroSerie}" maxlength="120" class="form-control"></label></div></section>
<section><h2>Aquisição e localização</h2><div class="form-grid"><label>Data de aquisição<input type="date" th:field="*{dataAquisicao}" class="form-control"></label><label>Valor de aquisição<input type="number" min="0" step="0.01" th:field="*{valorAquisicao}" class="form-control"></label><label>Estrutura<select th:field="*{estruturaId}" class="form-select"><option value="">Sem vínculo</option><option th:each="e:${estruturas}" th:value="${e.id}" th:text="${e.nome}"></option></select></label><label>Localização complementar<input th:field="*{localizacao}" maxlength="160" class="form-control"></label><label class="wide">Observação<textarea th:field="*{observacao}" maxlength="1000" rows="3" class="form-control"></textarea></label></div></section><div class="form-actions"><a th:href="@{/sitio/manutencao/ativos}" class="btn btn-outline-dark">Cancelar</a><button class="btn btn-success">Salvar ativo</button></div></form>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
