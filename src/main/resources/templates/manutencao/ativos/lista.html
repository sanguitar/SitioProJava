<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Patrimônio')}"></th:block><link rel="stylesheet" th:href="@{/css/manutencao.css}"><link rel="stylesheet" th:href="@{/css/patrimonio.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-patrimonio maintenance-page"><div th:replace="~{fragments/ui :: topbar('Patrimônio', 'Propriedade / Patrimônio')}"></div>
<header class="maintenance-heading"><div><small>INVENTÁRIO OPERACIONAL</small><h1>Ativos patrimoniais</h1><p>Máquinas, equipamentos, ferramentas e demais bens sujeitos a manutenção.</p></div><div><a th:href="@{/sitio/manutencao}" class="btn btn-outline-dark">Dashboard</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/manutencao/ativos/novo}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Novo ativo</a></div></header>
<section class="maintenance-panel"><div class="asset-grid"><a class="asset-card" th:each="a:${ativos}" th:href="@{/sitio/manutencao/ativos/{id}(id=${a.id})}"><div><span class="asset-code" th:text="${a.codigo}">PAT</span><span class="status-badge" th:classappend="${a.status.name() == 'ATIVO' ? ' status-functional' : a.status.name() == 'EM_MANUTENCAO' ? ' status-development' : ' status-review'}" th:text="${a.status.rotulo}">Ativo</span></div><h2 th:text="${a.nome}">Ativo</h2><p th:text="${a.tipo.rotulo + (a.marca != null ? ' · ' + a.marca : '') + (a.modelo != null ? ' ' + a.modelo : '')}">Tipo</p><small th:text="${a.estruturaNome != null ? a.estruturaNome : (a.localizacao != null ? a.localizacao : 'Local não informado')}">Local</small></a><div class="empty-state-card" th:if="${#lists.isEmpty(ativos)}"><i class="fa-solid fa-box-archive"></i><div><strong>Nenhum ativo cadastrado</strong><p>Cadastre o primeiro equipamento para iniciar o histórico de manutenção.</p></div></div></div></section>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
