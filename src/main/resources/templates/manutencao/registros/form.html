<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Registrar manutenção')}"></th:block><link rel="stylesheet" th:href="@{/css/manutencao.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-manutencao maintenance-page"><div th:replace="~{fragments/ui :: topbar('Registrar manutenção', 'Propriedade / Manutenção')}"></div>
<header class="maintenance-heading"><div><small>INTERVENÇÃO TÉCNICA</small><h1>Registrar manutenção</h1><p>Informe o serviço realizado e, quando houver, os materiais efetivamente consumidos.</p></div><a th:href="@{/sitio/manutencao}" class="btn btn-outline-dark">Voltar</a></header>
<form th:action="@{/sitio/manutencao/registros}" th:object="${manutencaoForm}" method="post" class="maintenance-panel maintenance-form"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{chaveIdempotencia}">
<section><h2>Serviço realizado</h2><div class="form-grid"><label>Ativo<select th:field="*{ativoId}" class="form-select" required><option value="">Selecione</option><option th:each="a:${ativos}" th:value="${a.id}" th:text="${a.codigo + ' · ' + a.nome}"></option></select></label><label>Plano preventivo<select th:field="*{planoPreventivoId}" class="form-select"><option value="">Manutenção avulsa</option><option th:each="p:${planosPreventivos}" th:value="${p.id}" th:text="${p.nome + ' · ' + p.tipoPeriodicidade.rotulo}"></option></select></label><label>Tipo<select th:field="*{tipo}" class="form-select" required><option value="">Selecione</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select></label><label>Data/hora<input type="datetime-local" th:field="*{dataManutencao}" class="form-control" required></label><label>Responsável<input th:field="*{responsavel}" maxlength="120" class="form-control" required></label><label class="wide">Descrição<input th:field="*{descricao}" maxlength="500" class="form-control" required></label><label>Horímetro<input type="number" min="0" step="0.01" th:field="*{horimetro}" class="form-control"></label><label>Quilometragem<input type="number" min="0" step="0.01" th:field="*{quilometragem}" class="form-control"></label><label>Custo do serviço<input type="number" min="0" step="0.01" th:field="*{custo}" class="form-control" required></label><label>Próxima manutenção<input type="datetime-local" th:field="*{proximaManutencao}" class="form-control"></label><label class="wide">Observação<textarea th:field="*{observacao}" maxlength="1000" rows="3" class="form-control"></textarea></label></div></section>
<section><h2>Consumo de estoque</h2><p class="section-help">Preencha somente as linhas usadas. O saldo será movimentado pelo Estoque oficial.</p><div class="consumption-grid" th:each="c,stat:*{consumos}"><label>Item<select th:field="*{consumos[__${stat.index}__].itemEstoqueId}" class="form-select"><option value="">Sem item</option><option th:each="i:${itensEstoque}" th:value="${i.id}" th:text="${i.nome + ' (' + i.unidadeMedida.sigla + ')'}"></option></select></label><label>Local<select th:field="*{consumos[__${stat.index}__].localEstoqueId}" class="form-select"><option value="">Selecione</option><option th:each="l:${locaisEstoque}" th:value="${l.id}" th:text="${l.nome}"></option></select></label><label>Quantidade<input type="number" min="0.0001" step="0.0001" th:field="*{consumos[__${stat.index}__].quantidade}" class="form-control"></label><label>Lote<input th:field="*{consumos[__${stat.index}__].loteEstoqueCodigo}" maxlength="100" class="form-control"></label></div></section><div class="form-actions"><a th:href="@{/sitio/manutencao}" class="btn btn-outline-dark">Cancelar</a><button class="btn btn-success">Registrar manutenção</button></div></form>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
