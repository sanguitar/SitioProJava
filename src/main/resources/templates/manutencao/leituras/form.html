<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Leitura de medidor')}"></th:block><link rel="stylesheet" th:href="@{/css/manutencao.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-manutencao maintenance-page"><div th:replace="~{fragments/ui :: topbar(${ajuste ? 'Ajustar leitura' : 'Registrar leitura'}, 'Manutenção / Ativos')}"></div>
<header class="maintenance-heading"><div><small th:text="${ativo.codigo}">PAT</small><h1 th:text="${ajuste ? 'Ajuste administrativo' : 'Leitura de medidor'}">Leitura</h1><p th:text="${ajuste ? 'Correção auditável. O histórico anterior será preservado.' : ativo.nome}">Ativo</p></div><a th:href="@{/sitio/manutencao/ativos/{id}(id=${ativo.id})}" class="btn btn-outline-dark">Voltar</a></header>
<form th:action="${ajuste ? '/sitio/manutencao/leituras/ajuste' : '/sitio/manutencao/leituras'}" th:object="${leituraForm}" method="post" class="maintenance-panel maintenance-form"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{ativoId}"><input type="hidden" th:field="*{chaveIdempotencia}"><section><h2>Leitura</h2><div class="form-grid"><label>Data/hora<input type="datetime-local" th:field="*{dataLeitura}" class="form-control" required></label><label>Horímetro<input type="number" min="0" step="0.01" th:field="*{horimetro}" class="form-control" placeholder="Horas acumuladas"></label><label>Quilometragem<input type="number" min="0" step="0.01" th:field="*{quilometragem}" class="form-control" placeholder="Quilômetros acumulados"></label><label class="wide" th:if="${ajuste}">Justificativa do ajuste<textarea th:field="*{justificativaAjuste}" maxlength="500" rows="3" class="form-control" required></textarea></label></div><p class="section-help" th:unless="${ajuste}">Leituras operacionais não podem regredir. Correções ficam disponíveis somente para administradores.</p></section><div class="form-actions"><a th:href="@{/sitio/manutencao/ativos/{id}(id=${ativo.id})}" class="btn btn-outline-dark">Cancelar</a><button class="btn btn-success" th:text="${ajuste ? 'Registrar ajuste' : 'Registrar leitura'}">Registrar</button></div></form><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
