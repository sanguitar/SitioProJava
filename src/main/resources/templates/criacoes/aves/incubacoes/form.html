<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Nova incubação')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Nova incubação', 'Criações / Aves')}"></div><header class="aves-page-heading"><div><small class="module-group">Incubadora</small><h1>Iniciar incubação</h1></div><a th:href="@{/sitio/criacoes/aves/incubacoes}" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left me-2"></i>Voltar</a></header>
<section class="aves-form-panel"><form th:action="@{/sitio/criacoes/aves/incubacoes}" th:object="${incubacaoForm}" method="post" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="col-md-5"><label class="form-label" for="codigo">Código</label><input id="codigo" class="form-control" th:field="*{codigo}" required></div><div class="col-md-7"><label class="form-label" for="instalacaoId">Incubadora</label><select id="instalacaoId" class="form-select" th:field="*{instalacaoId}" required><option value="">Selecione</option><option th:each="i:${incubadoras}" th:value="${i.id}" th:text="${i.nome}"></option></select></div><div class="col-md-4"><label class="form-label" for="dataInicio">Início</label><input id="dataInicio" type="date" class="form-control" th:field="*{dataInicio}" required></div><div class="col-md-4"><label class="form-label" for="quantidadeOvos">Quantidade de ovos</label><input id="quantidadeOvos" type="number" min="1" class="form-control" th:field="*{quantidadeOvos}" required></div><div class="col-md-4"><label class="form-label" for="dataPrevistaEclosao">Previsão de eclosão</label><input id="dataPrevistaEclosao" type="date" class="form-control" th:field="*{dataPrevistaEclosao}" required></div><div class="col-md-6"><label class="form-label" for="loteReprodutorId">Lote reprodutor</label><select id="loteReprodutorId" class="form-select" th:field="*{loteReprodutorId}"><option value="">Não informado</option><option th:each="l:${lotes}" th:value="${l.id}" th:text="${l.codigo + (l.nome == null ? '' : ' · ' + l.nome)}"></option></select></div><div class="col-md-6"><label class="form-label" for="origemOvos">Origem dos ovos</label><input id="origemOvos" class="form-control" th:field="*{origemOvos}"></div><div class="col-12"><label class="form-label" for="observacao">Observação</label><textarea id="observacao" class="form-control" rows="3" th:field="*{observacao}"></textarea></div><div class="col-12 text-end"><button class="btn btn-success"><i class="fa-solid fa-play me-2"></i>Iniciar incubação</button></div></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
