<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Incubação')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Incubação', 'Criações / Aves')}"></div>
<header class="aves-page-heading"><div><small class="module-group" th:text="${incubacao.instalacaoNome}">Incubadora</small><h1 th:text="${incubacao.codigo}">I-1</h1></div><div class="aves-heading-actions"><div th:replace="~{criacoes/aves/fragments :: status(${incubacao.status})}"></div><a th:href="@{/sitio/criacoes/aves/incubacoes}" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left"></i></a></div></header><div th:replace="~{criacoes/aves/fragments :: messages}"></div>
<section class="aves-detail-summary"><article><span>Ovos incubados</span><strong th:text="${incubacao.quantidadeOvos}">0</strong></article><article><span>Início</span><strong th:text="${#temporals.format(incubacao.dataInicio,'dd/MM/yyyy')}">-</strong></article><article><span>Previsão</span><strong th:text="${#temporals.format(incubacao.dataPrevistaEclosao,'dd/MM/yyyy')}">-</strong></article><article><span>Eclodidos</span><strong th:text="${incubacao.pintinhosEclodidos ?: '-'}">-</strong></article><article><span>Taxa de eclosão</span><strong th:text="${incubacao.taxaEclosao == null ? '-' : #numbers.formatDecimal(incubacao.taxaEclosao,1,'POINT',1,'COMMA') + '%'}">-</strong></article><article><span>Taxa de perdas</span><strong th:text="${incubacao.taxaPerdas == null ? '-' : #numbers.formatDecimal(incubacao.taxaPerdas,1,'POINT',1,'COMMA') + '%'}">-</strong></article></section>
<section class="aves-two-column"><div class="aves-panel"><div class="panel-heading"><h2>Dados do ciclo</h2></div><dl class="aves-kv"><div><dt>Origem dos ovos</dt><dd th:text="${incubacao.origemOvos ?: '-'}">-</dd></div><div><dt>Lote reprodutor</dt><dd><a th:if="${incubacao.loteReprodutorId}" th:href="@{/sitio/criacoes/aves/lotes/{id}(id=${incubacao.loteReprodutorId})}" th:text="${incubacao.loteReprodutorCodigo}">Lote</a><span th:unless="${incubacao.loteReprodutorId}">-</span></dd></div><div><dt>Data real de eclosão</dt><dd th:text="${incubacao.dataEclosao == null ? '-' : #temporals.format(incubacao.dataEclosao,'dd/MM/yyyy')}">-</dd></div><div><dt>Observação</dt><dd th:text="${incubacao.observacao ?: '-'}">-</dd></div><div><dt>Lote resultante</dt><dd><a th:if="${incubacao.loteResultanteId}" th:href="@{/sitio/criacoes/aves/lotes/{id}(id=${incubacao.loteResultanteId})}" th:text="${incubacao.loteResultanteCodigo}">Lote</a><span th:unless="${incubacao.loteResultanteId}">-</span></dd></div></dl></div>
<div class="aves-panel" th:if="${incubacao.status.name() == 'EM_INCUBACAO'}"><div class="panel-heading"><h2>Finalizar incubação</h2><span>Operação atômica</span></div><form th:action="@{/sitio/criacoes/aves/incubacoes/{id}/finalizar(id=${incubacao.id})}" th:object="${finalizacaoForm}" method="post" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotenciaLote}"><div class="col-md-4"><label class="form-label" for="pintinhosEclodidos">Eclodidos</label><input id="pintinhosEclodidos" type="number" min="0" class="form-control" th:field="*{pintinhosEclodidos}" required></div><div class="col-md-4"><label class="form-label" for="ovosPerdidos">Perdas</label><input id="ovosPerdidos" type="number" min="0" class="form-control" th:field="*{ovosPerdidos}" required></div><div class="col-md-4"><label class="form-label" for="dataEclosao">Data</label><input id="dataEclosao" type="date" class="form-control" th:field="*{dataEclosao}" required></div><div class="col-12 form-check-switch"><input id="criarLote" type="checkbox" class="form-check-input" th:field="*{criarLote}"><label for="criarLote">Criar lote de pintinhos</label></div><div class="col-md-6"><span class="form-label">Código do lote</span><div class="aves-generated-code"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span>Gerado automaticamente ao finalizar</span></div></div><div class="col-md-6"><label class="form-label" for="nomeLote">Nome do lote</label><input id="nomeLote" class="form-control" th:field="*{nomeLote}"></div><div class="col-md-6"><label class="form-label" for="instalacaoDestinoId">Alojamento dos pintinhos</label><select id="instalacaoDestinoId" class="form-select" th:field="*{instalacaoDestinoId}"><option value="">Selecione</option><option th:each="i:${instalacoes}" th:value="${i.id}" th:text="${i.nome}"></option></select></div><div class="col-md-3"><label class="form-label" for="finalidadeLote">Finalidade</label><select id="finalidadeLote" class="form-select" th:field="*{finalidadeLote}"><option th:each="f:${finalidades}" th:value="${f}" th:text="${f.rotulo}"></option></select></div><div class="col-md-3"><label class="form-label" for="sexoLote">Classificação</label><select id="sexoLote" class="form-select" th:field="*{sexoLote}"><option th:each="s:${sexos}" th:value="${s}" th:text="${s.rotulo}"></option></select></div><div class="col-12 d-flex gap-2 justify-content-end"><button class="btn btn-success"><i class="fa-solid fa-circle-check me-2"></i>Finalizar</button></div></form><form sec:authorize="hasRole('ADMIN')" th:action="@{/sitio/criacoes/aves/incubacoes/{id}/cancelar(id=${incubacao.id})}" method="post" class="mt-3 text-end"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-danger"><i class="fa-solid fa-ban me-2"></i>Cancelar incubação</button></form></div></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
