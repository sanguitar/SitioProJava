<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Cadastro de instalação')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>
<main class="main-content domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar(${instalacaoId == null ? 'Nova instalação' : 'Editar instalação'}, 'Criações / Aves')}"></div><header class="aves-page-heading"><div><small class="module-group">Alojamentos</small><h1 th:text="${instalacaoId == null ? 'Nova instalação' : 'Editar instalação'}">Nova instalação</h1></div><a th:href="${instalacaoId == null ? '/sitio/criacoes/aves/instalacoes' : '/sitio/criacoes/aves/instalacoes/' + instalacaoId}" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left me-2"></i>Voltar</a></header>
<section class="aves-form-panel"><form th:action="${instalacaoId == null ? '/sitio/criacoes/aves/instalacoes' : '/sitio/criacoes/aves/instalacoes/' + instalacaoId}" th:object="${instalacaoForm}" method="post" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
<div class="col-md-7"><label class="form-label" for="nome">Nome</label><input id="nome" class="form-control" th:field="*{nome}" maxlength="120" required><div class="text-danger small" th:errors="*{nome}"></div></div><div class="col-md-5"><label class="form-label" for="tipo">Tipo</label><select id="tipo" class="form-select" th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select></div>
<div class="col-12"><label class="form-label" for="estruturaId">Estrutura física da propriedade</label><select id="estruturaId" class="form-select" th:field="*{estruturaId}"><option value="">Sem vínculo</option><option th:each="e : ${estruturas}" th:value="${e.id}" th:text="${e.nome}"></option></select></div>
<div class="col-md-4"><label class="form-label" for="capacidade">Capacidade de aves</label><input id="capacidade" type="number" min="1" class="form-control" th:field="*{capacidade}"></div><div class="col-md-8"><label class="form-label" for="descricao">Descrição</label><input id="descricao" class="form-control" th:field="*{descricao}" maxlength="500"></div><div class="col-12 form-check-switch"><input id="ativo" type="checkbox" class="form-check-input" th:field="*{ativo}"><label for="ativo">Instalação ativa</label></div><div class="col-12 text-end"><button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk me-2"></i>Salvar</button></div></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
