<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Instalações')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body>
<aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Instalações', 'Criações / Aves')}"></div>
<header class="aves-page-heading"><div><small class="module-group">Alojamentos</small><h1>Instalações</h1><p>Incubadoras, criadouros, galinheiros e piquetes.</p></div><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/criacoes/aves/instalacoes/nova}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Nova instalação</a></header>
<div th:replace="~{criacoes/aves/fragments :: tabs('instalacoes')}"></div><div th:replace="~{criacoes/aves/fragments :: messages}"></div>
<section class="table-container"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Nome</th><th>Tipo</th><th>Ocupação</th><th>Capacidade</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="i : ${pagina.conteudo}"><td><strong th:text="${i.nome}">Galinheiro</strong></td><td th:text="${i.tipoRotulo}">Tipo</td><td th:text="${i.ocupacao}">0</td><td th:text="${i.capacidade ?: 'Sem limite'}">-</td><td><span class="status-badge-visual" th:classappend="${i.ativo} ? ' status-functional' : ' status-review'" th:text="${i.ativo ? 'ATIVA' : 'INATIVA'}">ATIVA</span></td><td class="text-end"><a th:href="@{/sitio/criacoes/aves/instalacoes/{id}(id=${i.id})}" class="btn btn-sm btn-outline-dark" aria-label="Abrir instalação"><i class="fa-solid fa-arrow-right"></i></a></td></tr>
<tr th:if="${#lists.isEmpty(pagina.conteudo)}"><td colspan="6"><div class="empty-state-card"><i class="fa-solid fa-house-chimney"></i><div><strong>Nenhuma instalação</strong><p>Cadastre um alojamento para receber os lotes.</p></div></div></td></tr>
</tbody></table></div></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
