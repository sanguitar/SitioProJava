<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Instalação')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Instalação', 'Criações / Aves')}"></div>
<header class="aves-page-heading"><div><small class="module-group" th:text="${instalacao.tipoRotulo}">Tipo</small><h1 th:text="${instalacao.nome}">Nome</h1></div><div class="aves-heading-actions"><a th:href="@{/sitio/criacoes/aves/instalacoes}" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left"></i></a><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/criacoes/aves/instalacoes/{id}/editar(id=${instalacao.id})}" class="btn btn-success"><i class="fa-solid fa-pen me-2"></i>Editar</a></div></header><div th:replace="~{criacoes/aves/fragments :: messages}"></div>
<section class="aves-detail-summary"><article><span>Status</span><strong th:text="${instalacao.ativo ? 'Ativa' : 'Inativa'}">Ativa</strong></article><article><span>Ocupação</span><strong th:text="${instalacao.ocupacao + ' aves'}">0 aves</strong></article><article><span>Capacidade</span><strong th:text="${instalacao.capacidade ?: 'Sem limite'}">-</strong></article></section>
<section class="aves-panel"><div class="panel-heading"><h2>Dados da instalação</h2><span th:text="${instalacao.tipoRotulo}">Tipo</span></div><dl class="aves-kv"><div><dt>Descrição</dt><dd th:text="${instalacao.descricao ?: '-'}">-</dd></div><div th:if="${instalacao.estruturaId != null}"><dt>Estrutura física</dt><dd><a th:href="@{/sitio/propriedade/estruturas/{id}(id=${instalacao.estruturaId})}" th:text="${instalacao.estruturaNome}"></a></dd></div><div><dt>Criada por</dt><dd th:text="${instalacao.criadoPor ?: '-'}">-</dd></div><div><dt>Última alteração</dt><dd th:text="${instalacao.alteradoEm == null ? '-' : #temporals.format(instalacao.alteradoEm, 'dd/MM/yyyy HH:mm')}">-</dd></div></dl></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
