<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Lotes')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Lotes de aves', 'Criações / Aves')}"></div>
<header class="aves-page-heading"><div><small class="module-group">Plantel por lote</small><h1>Lotes de aves</h1><p>Quantidade, finalidade e alojamento atual.</p></div><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/criacoes/aves/lotes/novo}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Novo lote</a></header><div th:replace="~{criacoes/aves/fragments :: tabs('lotes')}"></div><div th:replace="~{criacoes/aves/fragments :: messages}"></div>
<form method="get" class="aves-filter-bar"><label class="visually-hidden" for="termo">Buscar lote</label><input id="termo" name="termo" class="form-control" th:value="${termo}" placeholder="Código ou nome"><select name="status" class="form-select" aria-label="Status"><option value="">Todos os status</option><option th:each="s : ${statusLotes}" th:value="${s}" th:text="${s.rotulo}" th:selected="${s == statusSelecionado}"></option></select><button class="btn btn-outline-dark" type="submit"><i class="fa-solid fa-magnifying-glass"></i><span class="visually-hidden">Filtrar</span></button></form>
<section class="table-container"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Lote</th><th>Finalidade</th><th>Instalação</th><th>Quantidade</th><th>Entrada</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="l : ${pagina.conteudo}"><td><strong th:text="${l.codigo}">L-1</strong><small class="d-block text-secondary" th:text="${l.nome ?: l.especie.rotulo}">Nome</small></td><td th:text="${l.finalidade.rotulo}">Postura</td><td th:text="${l.instalacaoNome}">Galinheiro</td><td><strong th:text="${l.quantidadeAtual}">0</strong> aves</td><td th:text="${#temporals.format(l.dataEntrada, 'dd/MM/yyyy')}">-</td><td><div th:replace="~{criacoes/aves/fragments :: status(${l.status})}"></div></td><td class="text-end"><a th:href="@{/sitio/criacoes/aves/lotes/{id}(id=${l.id})}" class="btn btn-sm btn-outline-dark" aria-label="Abrir lote"><i class="fa-solid fa-arrow-right"></i></a></td></tr><tr th:if="${#lists.isEmpty(pagina.conteudo)}"><td colspan="7"><div class="empty-state-card"><i class="fa-solid fa-feather"></i><div><strong>Nenhum lote encontrado</strong><p>Ajuste o filtro ou cadastre o primeiro lote.</p></div></div></td></tr></tbody></table></div></section>
<nav class="aves-pagination" th:if="${pagina.totalPaginas > 1}"><a th:if="${pagina.pagina > 0}" th:href="@{/sitio/criacoes/aves/lotes(pagina=${pagina.pagina - 1},status=${statusSelecionado},termo=${termo})}">Anterior</a><span th:text="${'Página ' + (pagina.pagina + 1) + ' de ' + pagina.totalPaginas}">Página</span><a th:if="${pagina.pagina + 1 < pagina.totalPaginas}" th:href="@{/sitio/criacoes/aves/lotes(pagina=${pagina.pagina + 1},status=${statusSelecionado},termo=${termo})}">Próxima</a></nav>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
