<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Novo lote')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Novo lote', 'Criações / Aves')}"></div><header class="aves-page-heading"><div><small class="module-group">Entrada de plantel</small><h1>Novo lote</h1></div><a th:href="@{/sitio/criacoes/aves/lotes}" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left me-2"></i>Voltar</a></header>
<section class="aves-form-panel"><form th:action="@{/sitio/criacoes/aves/lotes}" th:object="${loteForm}" method="post" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
<div class="col-md-4"><label class="form-label" for="codigo">Código</label><input id="codigo" class="form-control" th:field="*{codigo}" maxlength="80" required></div><div class="col-md-8"><label class="form-label" for="nome">Nome ou apelido</label><input id="nome" class="form-control" th:field="*{nome}" maxlength="120"></div>
<div class="col-md-4"><label class="form-label" for="especie">Espécie</label><select id="especie" class="form-select" th:field="*{especie}" required><option th:each="e : ${especies}" th:value="${e}" th:text="${e.rotulo}"></option></select></div><div class="col-md-4"><label class="form-label" for="finalidade">Finalidade</label><select id="finalidade" class="form-select" th:field="*{finalidade}" required><option value="">Selecione</option><option th:each="f : ${finalidades}" th:value="${f}" th:text="${f.rotulo}"></option></select></div><div class="col-md-4"><label class="form-label" for="sexo">Classificação</label><select id="sexo" class="form-select" th:field="*{sexo}" required><option th:each="s : ${sexos}" th:value="${s}" th:text="${s.rotulo}"></option></select></div>
<div class="col-md-6"><label class="form-label" for="linhagem">Linhagem ou raça</label><input id="linhagem" class="form-control" th:field="*{linhagem}" maxlength="120"></div><div class="col-md-6"><label class="form-label" for="origem">Origem</label><input id="origem" class="form-control" th:field="*{origem}" maxlength="200" required></div>
<div class="col-md-4"><label class="form-label" for="dataEntrada">Entrada</label><input id="dataEntrada" type="date" class="form-control" th:field="*{dataEntrada}" required></div><div class="col-md-4"><label class="form-label" for="dataNascimento">Nascimento</label><input id="dataNascimento" type="date" class="form-control" th:field="*{dataNascimento}"></div><div class="col-md-4"><label class="form-label" for="quantidadeInicial">Quantidade inicial</label><input id="quantidadeInicial" type="number" min="1" class="form-control" th:field="*{quantidadeInicial}" required></div>
<div class="col-md-8"><label class="form-label" for="instalacaoId">Instalação</label><select id="instalacaoId" class="form-select" th:field="*{instalacaoId}" required><option value="">Selecione</option><option th:each="i : ${instalacoes}" th:value="${i.id}" th:text="${i.nome + (i.capacidade == null ? '' : ' · capacidade ' + i.capacidade)}"></option></select></div><div class="col-md-4"><label class="form-label" for="custoInicial">Custo inicial</label><input id="custoInicial" type="number" min="0" step="0.0001" class="form-control" th:field="*{custoInicial}"></div><div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea id="observacoes" class="form-control" rows="3" maxlength="1000" th:field="*{observacoes}"></textarea></div><div class="col-12 text-end"><button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk me-2"></i>Cadastrar lote</button></div></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
