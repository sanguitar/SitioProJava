<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Aves - Editar lote')}"></th:block><link rel="stylesheet" th:href="@{/css/aves.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-aves aves-page"><div th:replace="~{fragments/ui :: topbar('Editar lote', 'Criações / Aves')}"></div><header class="aves-page-heading"><div><small class="module-group">Dados cadastrais</small><h1>Editar lote</h1></div><a th:href="@{/sitio/criacoes/aves/lotes/{id}(id=${loteId})}" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-left me-2"></i>Voltar</a></header>
<section class="aves-form-panel"><form th:action="@{/sitio/criacoes/aves/lotes/{id}(id=${loteId})}" th:object="${loteForm}" method="post" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-4"><label class="form-label" for="codigo">Código</label><input id="codigo" class="form-control" th:field="*{codigo}" required></div><div class="col-md-8"><label class="form-label" for="nome">Nome</label><input id="nome" class="form-control" th:field="*{nome}"></div><div class="col-md-4"><label class="form-label" for="especie">Espécie</label><select id="especie" class="form-select" th:field="*{especie}"><option th:each="e:${especies}" th:value="${e}" th:text="${e.rotulo}"></option></select></div><div class="col-md-4"><label class="form-label" for="finalidade">Finalidade</label><select id="finalidade" class="form-select" th:field="*{finalidade}"><option th:each="f:${finalidades}" th:value="${f}" th:text="${f.rotulo}"></option></select></div><div class="col-md-4"><label class="form-label" for="sexo">Classificação</label><select id="sexo" class="form-select" th:field="*{sexo}"><option th:each="s:${sexos}" th:value="${s}" th:text="${s.rotulo}"></option></select></div><div class="col-md-6"><label class="form-label" for="linhagem">Linhagem</label><input id="linhagem" class="form-control" th:field="*{linhagem}"></div><div class="col-md-6"><label class="form-label" for="origem">Origem</label><input id="origem" class="form-control" th:field="*{origem}" required></div><div class="col-md-6"><label class="form-label" for="dataEntrada">Entrada</label><input id="dataEntrada" type="date" class="form-control" th:field="*{dataEntrada}"></div><div class="col-md-6"><label class="form-label" for="dataNascimento">Nascimento</label><input id="dataNascimento" type="date" class="form-control" th:field="*{dataNascimento}"></div><div class="col-12"><label class="form-label" for="observacoes">Observações</label><textarea id="observacoes" class="form-control" th:field="*{observacoes}" rows="3"></textarea></div><div class="col-12 text-end"><button class="btn btn-success"><i class="fa-solid fa-floppy-disk me-2"></i>Salvar alterações</button></div></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
