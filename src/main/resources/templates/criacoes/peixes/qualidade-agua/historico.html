<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Qualidade da água')}"></th:block><link rel="stylesheet" th:href="@{/css/piscicultura.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-piscicultura peixes-page"><div th:replace="~{fragments/ui :: topbar('Qualidade da água', 'Criações / Peixes')}"></div>
<header class="peixes-heading"><div><small th:text="${lote.instalacaoNome}">Tanque</small><h1 th:text="${lote.codigo}">PX</h1><p>Histórico de medições operacionais.</p></div><a th:href="@{/sitio/criacoes/peixes/lotes/{id}(id=${lote.id})}" class="btn btn-outline-dark">Voltar ao lote</a></header><div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
<div class="peixes-workspace"><section class="peixes-panel"><div class="panel-title"><h2>Histórico</h2><span th:text="${medicoes.size() + ' medições'}"></span></div><div class="water-history"><article th:each="m:${medicoes}" th:classappend="${m.dentroDosLimites ? 'water-normal' : 'water-warning'}"><div><strong th:text="${#temporals.format(m.medidoEm,'dd/MM/yyyy HH:mm')}"></strong><span th:text="${m.instalacaoNome}"></span></div><div class="water-values"><span><small>Temperatura</small><b th:text="${m.temperatura + ' °C'}"></b></span><span><small>pH</small><b th:text="${m.ph}"></b></span><span><small>Oxigênio</small><b th:text="${m.oxigenioDissolvido + ' mg/L'}"></b></span><span th:if="${m.transparenciaCm != null}"><small>Transparência</small><b th:text="${m.transparenciaCm + ' cm'}"></b></span><span th:if="${m.amonia != null}"><small>Amônia</small><b th:text="${m.amonia + ' mg/L'}"></b></span><span th:if="${m.nitrito != null}"><small>Nitrito</small><b th:text="${m.nitrito + ' mg/L'}"></b></span></div><p th:if="${!m.dentroDosLimites}" th:text="${#strings.listJoin(m.desvios, ', ')}"></p><small th:text="${'Responsável: ' + m.responsavel}"></small></article><p th:if="${#lists.isEmpty(medicoes)}">Nenhuma medição registrada.</p></div></section>
<aside class="peixes-actions"><h2>Nova medição</h2><form th:action="@{/sitio/criacoes/peixes/lotes/{id}/qualidade-agua(id=${lote.id})}" th:object="${medicaoForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}"><label>Data/hora<input type="datetime-local" th:field="*{medidoEm}" class="form-control" required></label><label>Temperatura (°C)<input type="number" step="0.0001" th:field="*{temperatura}" class="form-control" required></label><label>pH<input type="number" min="0" max="14" step="0.0001" th:field="*{ph}" class="form-control" required></label><label>Oxigênio dissolvido (mg/L)<input type="number" min="0" step="0.0001" th:field="*{oxigenioDissolvido}" class="form-control" required></label><label>Transparência (cm)<input type="number" min="0" step="0.0001" th:field="*{transparenciaCm}" class="form-control"></label><label>Amônia (mg/L)<input type="number" min="0" step="0.0001" th:field="*{amonia}" class="form-control"></label><label>Nitrito (mg/L)<input type="number" min="0" step="0.0001" th:field="*{nitrito}" class="form-control"></label><label>Responsável<input th:field="*{responsavel}" maxlength="120" class="form-control" required></label><label>Observação<textarea th:field="*{observacao}" maxlength="1000" class="form-control"></textarea></label><button class="btn btn-success">Registrar medição</button></form></aside></div><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
