<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Limites da qualidade da água')}"></th:block><link rel="stylesheet" th:href="@{/css/piscicultura.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-piscicultura peixes-page"><div th:replace="~{fragments/ui :: topbar('Limites da água', 'Criações / Peixes')}"></div><header class="peixes-heading"><div><small>CONFIGURAÇÃO OPERACIONAL</small><h1>Qualidade da água</h1><p>Limites usados nos alertas e no intervalo da próxima medição.</p></div><a th:href="@{/sitio/criacoes/peixes}" class="btn btn-outline-dark">Voltar</a></header><div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><section class="peixes-panel water-config"><form th:action="@{/sitio/criacoes/peixes/qualidade-agua/configuracao}" th:object="${configForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{versao}"><div class="water-config-grid"><label>Temperatura mínima (°C)<input type="number" step="0.0001" th:field="*{temperaturaMin}" class="form-control" required></label><label>Temperatura máxima (°C)<input type="number" step="0.0001" th:field="*{temperaturaMax}" class="form-control" required></label><label>pH mínimo<input type="number" min="0" max="14" step="0.0001" th:field="*{phMin}" class="form-control" required></label><label>pH máximo<input type="number" min="0" max="14" step="0.0001" th:field="*{phMax}" class="form-control" required></label><label>Oxigênio mínimo (mg/L)<input type="number" min="0" step="0.0001" th:field="*{oxigenioMin}" class="form-control" required></label><label>Transparência mínima (cm)<input type="number" min="0" step="0.0001" th:field="*{transparenciaMinCm}" class="form-control" required></label><label>Amônia máxima (mg/L)<input type="number" min="0" step="0.0001" th:field="*{amoniaMax}" class="form-control" required></label><label>Nitrito máximo (mg/L)<input type="number" min="0" step="0.0001" th:field="*{nitritoMax}" class="form-control" required></label><label>Intervalo entre medições (dias)<input type="number" min="1" max="365" th:field="*{intervaloMedicaoDias}" class="form-control" required></label></div><button class="btn btn-success">Salvar limites</button></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
