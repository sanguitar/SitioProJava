<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Novo lote de peixes')}"></th:block><link rel="stylesheet" th:href="@{/css/piscicultura.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-piscicultura peixes-page"><div th:replace="~{fragments/ui :: topbar('Novo lote', 'Criações / Peixes')}"></div><header class="peixes-heading"><div><h1>Novo lote de peixes</h1><p>O código PX será gerado automaticamente.</p></div></header>
<form th:action="@{/sitio/criacoes/peixes/lotes}" th:object="${loteForm}" method="post" class="peixes-panel peixes-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><label>Espécie<input th:field="*{especie}" maxlength="120" class="form-control" required></label><label>Tanque<select th:field="*{instalacaoId}" class="form-select" required><option value="">Selecione</option><option th:each="i:${instalacoes}" th:value="${i.id}" th:text="${i.nome}"></option></select></label><label>Quantidade inicial<input type="number" min="1" th:field="*{quantidadeInicial}" class="form-control" required></label><label>Peso médio (kg)<input type="number" min="0.0001" step="0.0001" th:field="*{pesoMedio}" class="form-control"></label><label>Data de entrada<input type="date" th:field="*{dataEntrada}" class="form-control" required></label><label class="wide">Origem<input th:field="*{origem}" maxlength="200" class="form-control" required></label><label class="wide">Observação<textarea th:field="*{observacao}" maxlength="1000" class="form-control" rows="3"></textarea></label></div><div class="form-actions"><a th:href="@{/sitio/criacoes/peixes/lotes}" class="btn btn-outline-dark">Cancelar</a><button class="btn btn-success">Cadastrar lote</button></div></form><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
