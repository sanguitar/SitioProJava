<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Lotes de peixes')}"></th:block><link rel="stylesheet" th:href="@{/css/piscicultura.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-piscicultura peixes-page"><div th:replace="~{fragments/ui :: topbar('Lotes de peixes', 'Criações / Peixes')}"></div>
<header class="peixes-heading"><div><h1>Lotes</h1><p>Acompanhe espécie, tanque, quantidade, peso e biomassa.</p></div><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/criacoes/peixes/lotes/novo}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Novo lote</a></header>
<form method="get" class="peixes-filters"><input class="form-control" name="termo" th:value="${termo}" placeholder="Código, espécie ou origem"><select class="form-select" name="status"><option value="">Todos os status</option><option th:each="s:${statusLotes}" th:value="${s}" th:text="${s.rotulo}" th:selected="${s == statusSelecionado}"></option></select><button class="btn btn-outline-dark">Filtrar</button></form>
<section class="peixes-panel table-responsive"><table class="table align-middle"><thead><tr><th>Código</th><th>Espécie</th><th>Quantidade</th><th>Peso médio</th><th>Biomassa</th><th>Tanque</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="l:${pagina.conteudo}"><td><strong th:text="${l.codigo}">PX</strong></td><td th:text="${l.especie}">Espécie</td><td th:text="${l.quantidadeAtual}">0</td><td th:text="${l.pesoMedio == null ? '-' : #numbers.formatDecimal(l.pesoMedio,1,'POINT',3,'COMMA') + ' kg'}">-</td><td th:text="${l.biomassaEstimada == null ? '-' : #numbers.formatDecimal(l.biomassaEstimada,1,'POINT',2,'COMMA') + ' kg'}">-</td><td th:text="${l.instalacaoNome}">Tanque</td><td th:text="${l.status.rotulo}">Ativo</td><td><a th:href="@{/sitio/criacoes/peixes/lotes/{id}(id=${l.id})}" class="btn btn-sm btn-outline-dark">Abrir</a></td></tr></tbody></table><div class="empty-state-card compact" th:if="${#lists.isEmpty(pagina.conteudo)}"><i class="fa-solid fa-water"></i><div><strong>Nenhum lote encontrado</strong></div></div></section>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
