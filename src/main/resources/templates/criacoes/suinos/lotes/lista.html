<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><th:block th:replace="~{fragments/head :: commonHead('Lotes de suínos')}"></th:block><link rel="stylesheet" th:href="@{/css/suinos.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content main-content-wide domain-suinos suinos-page"><div th:replace="~{fragments/ui :: topbar('Lotes de suínos', 'Criações / Suínos')}"></div>
<header class="suinos-heading"><div><h1>Lotes</h1><p>Acompanhe fase, instalação, quantidade e peso.</p></div><a sec:authorize="hasRole('ADMIN')" th:href="@{/sitio/criacoes/suinos/lotes/novo}" class="btn btn-success"><i class="fa-solid fa-plus me-2"></i>Novo lote</a></header>
<form method="get" class="suinos-filters"><input class="form-control" name="termo" th:value="${termo}" placeholder="Código ou origem"><select class="form-select" name="status"><option value="">Todos os status</option><option th:each="s:${statusLotes}" th:value="${s}" th:text="${s.rotulo}" th:selected="${s == statusSelecionado}"></option></select><button class="btn btn-outline-dark">Filtrar</button></form>
<section class="suinos-panel table-responsive"><table class="table align-middle"><thead><tr><th>Código</th><th>Fase</th><th>Quantidade</th><th>Peso médio</th><th>Instalação</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="l:${pagina.conteudo}"><td><strong th:text="${l.codigo}">SU</strong></td><td th:text="${l.categoria.rotulo}">Fase</td><td th:text="${l.quantidadeAtual}">0</td><td th:text="${l.pesoMedio == null ? '-' : #numbers.formatDecimal(l.pesoMedio,1,'POINT',2,'COMMA') + ' kg'}">-</td><td th:text="${l.instalacaoNome}">Instalação</td><td th:text="${l.status.rotulo}">Ativo</td><td><a th:href="@{/sitio/criacoes/suinos/lotes/{id}(id=${l.id})}" class="btn btn-sm btn-outline-dark">Abrir</a></td></tr></tbody></table><div class="empty-state-card compact" th:if="${#lists.isEmpty(pagina.conteudo)}"><i class="fa-solid fa-layer-group"></i><div><strong>Nenhum lote encontrado</strong></div></div></section>
<div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
