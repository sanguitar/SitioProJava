<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Identificar animal reprodutivo')}"></th:block><link rel="stylesheet" th:href="@{/css/suinos.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-suinos suinos-page"><div th:replace="~{fragments/ui :: topbar('Identificar animal', 'Criações / Suínos / Reprodução')}"></div><header class="suinos-heading"><div><small>CADASTRO INDIVIDUAL</small><h1>Matriz ou reprodutor</h1><p>O código operacional será gerado automaticamente.</p></div></header>
<section class="suinos-panel suinos-form"><form th:action="@{/sitio/criacoes/suinos/reproducao/animais}" th:object="${animalForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><label>Tipo<select class="form-select" th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t.rotulo}"></option></select></label><label>Lote de origem<select class="form-select" th:field="*{loteId}" required><option value="">Selecione</option><option th:each="l:${lotes}" th:value="${l.id}" th:text="${l.codigo + ' · ' + l.categoria.rotulo}"></option></select></label><label>Brinco / nome<input class="form-control" th:field="*{identificacao}" maxlength="120"></label><label>Data de nascimento<input type="date" class="form-control" th:field="*{dataNascimento}"></label><label>Peso atual (kg)<input type="number" min="0.0001" step="0.0001" class="form-control" th:field="*{pesoAtual}"></label><label class="wide">Observação<textarea class="form-control" th:field="*{observacao}" maxlength="1000"></textarea></label></div><div class="form-actions"><a class="btn btn-outline-dark" th:href="@{/sitio/criacoes/suinos/reproducao}">Cancelar</a><button class="btn btn-success">Identificar animal</button></div></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
