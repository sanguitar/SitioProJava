<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/head :: commonHead('Nova cobertura')}"></th:block><link rel="stylesheet" th:href="@{/css/suinos.css}"></head><body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside><main class="main-content domain-suinos suinos-page"><div th:replace="~{fragments/ui :: topbar('Nova cobertura', 'Criações / Suínos / Reprodução')}"></div><header class="suinos-heading"><div><small>NOVO CICLO</small><h1>Cobertura ou inseminação</h1><p>Checagem e parto previsto serão calculados automaticamente.</p></div></header>
<section class="suinos-panel suinos-form"><form th:action="@{/sitio/criacoes/suinos/reproducao/ciclos}" th:object="${cicloForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{chaveIdempotencia}"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><label>Matriz<select class="form-select" th:field="*{matrizId}" required><option value="">Selecione</option><option th:each="a:${matrizes}" th:value="${a.id}" th:text="${a.codigo + (a.identificacao == null ? '' : ' · ' + a.identificacao)}"></option></select></label><label>Método<select class="form-select" th:field="*{metodo}" required><option th:each="m:${metodos}" th:value="${m}" th:text="${m.rotulo}"></option></select></label><label>Reprodutor<select class="form-select" th:field="*{reprodutorId}"><option value="">Não informado / inseminação</option><option th:each="a:${reprodutores}" th:value="${a.id}" th:text="${a.codigo + (a.identificacao == null ? '' : ' · ' + a.identificacao)}"></option></select></label><label>Data<input type="date" class="form-control" th:field="*{dataCobertura}" required></label><label class="wide">Observação<textarea class="form-control" th:field="*{observacao}" maxlength="1000"></textarea></label></div><div class="form-actions"><a class="btn btn-outline-dark" th:href="@{/sitio/criacoes/suinos/reproducao}">Cancelar</a><button class="btn btn-success">Registrar cobertura</button></div></form></section><div th:replace="~{fragments/ui :: appFooter}"></div></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
