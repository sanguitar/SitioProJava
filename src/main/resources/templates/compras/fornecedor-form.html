<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Novo Fornecedor')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/compras.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>

    <main class="main-content main-content-wide compras-page domain-compras">
        <div th:replace="~{fragments/ui :: topbar('Novo fornecedor', 'Compras')}"></div>

        <div class="page-heading">
            <div>
                <small class="module-group">Compras</small>
                <h1>Novo fornecedor</h1>
            </div>
            <a th:href="@{/sitio/compras/fornecedores}" class="btn btn-outline-dark">
                <i class="fa-solid fa-arrow-left me-2"></i>Voltar
            </a>
        </div>

        <div th:replace="~{compras/fragments :: tabs('fornecedores')}"></div>

        <section class="compras-panel">
            <form th:action="@{/sitio/compras/fornecedores}" th:object="${fornecedorForm}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

                <div class="col-md-7">
                    <label class="form-label" for="nome">Nome</label>
                    <input id="nome" type="text" th:field="*{nome}" class="form-control" maxlength="140" required>
                    <div class="text-danger small" th:errors="*{nome}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="documento">Documento</label>
                    <input id="documento" type="text" th:field="*{documento}" class="form-control" maxlength="40">
                    <div class="text-danger small" th:errors="*{documento}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="telefone">Telefone</label>
                    <input id="telefone" type="text" th:field="*{telefone}" class="form-control" maxlength="40">
                    <div class="text-danger small" th:errors="*{telefone}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="email">E-mail</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" maxlength="140">
                    <div class="text-danger small" th:errors="*{email}"></div>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="form-check form-switch pb-2">
                        <input id="ativo" type="checkbox" th:field="*{ativo}" class="form-check-input" role="switch">
                        <label for="ativo" class="form-check-label">Ativo</label>
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="observacao">Observação</label>
                    <textarea id="observacao" th:field="*{observacao}" class="form-control" rows="3" maxlength="500"></textarea>
                    <div class="text-danger small" th:errors="*{observacao}"></div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/sitio/compras/fornecedores}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Salvar fornecedor
                    </button>
                </div>
            </form>
        </section>

        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
