<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Configurações')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/categoria.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar('categoria')}"></aside>

    <main class="main-content">
        <div th:replace="~{fragments/ui :: topbar('Categorias atuais', 'Administração')}"></div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card card-config p-4">
                    <h5 class="card-config-title">
                        <i class="fa-solid fa-folder-plus me-2"></i>Nova Categoria
                    </h5>

                    <form th:action="@{/sitio/configuracoes/categoria/salvar}" th:object="${novaCategoria}" method="post" id="formCategoria">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome da Categoria</label>
                            <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex: Gado de Corte" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Selecione um Ícone Representativo</label>
                            <div class="icon-grid">
                                <div class="icon-item" data-icon="fa-tractor" title="Maquinário"><i class="fa-solid fa-tractor fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-cow" title="Gado"><i class="fa-solid fa-cow fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-seedling" title="Plantação"><i class="fa-solid fa-seedling fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-wheat-awn" title="Grãos"><i class="fa-solid fa-wheat-awn fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-truck-pickup" title="Logística"><i class="fa-solid fa-truck-pickup fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-fish" title="Piscicultura"><i class="fa-solid fa-fish fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-droplet" title="Irrigação"><i class="fa-solid fa-droplet fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-warehouse" title="Armazenamento"><i class="fa-solid fa-warehouse fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-tools" title="Oficina"><i class="fa-solid fa-tools fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-bug" title="Defensivos"><i class="fa-solid fa-bug fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-tree" title="Fruticultura"><i class="fa-solid fa-tree fs-3"></i></div>
                                <div class="icon-item" data-icon="fa-solar-panel" title="Energia"><i class="fa-solid fa-solar-panel fs-3"></i></div>
                            </div>

                            <input type="hidden" th:field="*{icone}" id="hiddenIconInput" required>
                            <div id="selectedIconName" class="mt-2 small text-muted fst-italic">Nenhum ícone selecionado</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Cor de Identificação</label>
                            <input type="color" th:field="*{corHex}" class="form-control form-control-color w-100" title="Escolha a cor da categoria">
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                            <i class="fa-solid fa-floppy-disk me-2"></i>Cadastrar categoria
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card card-config p-4">
                    <h5 class="card-config-title">Categorias no SQL Server</h5>
                    <div class="table-responsive-soft">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Ícone</th>
                                    <th>Nome</th>
                                    <th class="text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categorias}">
                                    <td>
                                        <div class="category-icon-preview">
                                            <i th:class="'fa-solid ' + ${cat.icone} + ' fs-4'" th:style="'color: ' + ${cat.corHex}"></i>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="fw-bold text-dark" th:text="${cat.nome}">Nome</span>
                                        <br><small class="text-muted" th:text="${cat.corHex}">#000000</small>
                                    </td>
                                    <td class="text-center">
                                        <form th:action="@{/sitio/configuracoes/categoria/excluir/{id}(id=${cat.id})}"
                                              method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                                    data-confirm-message="Excluir esta categoria? Isso pode afetar itens vinculados.">
                                                <i class="fa-solid fa-trash-can"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/ui :: appFooter}"></div>
    </main>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
    <script th:src="@{/js/categoria.js}"></script>
</body>
</html>
