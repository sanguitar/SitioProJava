<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/head :: commonHead(${titulo} + ' - Agricultura')}"></th:block>
<link rel="stylesheet" th:href="@{/css/agricultura.css}"></head>
<body><aside th:replace="~{fragments/sidebar :: sidebar(${active})}"></aside>
<main class="main-content agriculture-page">
<div th:replace="~{fragments/ui :: topbar(${titulo}, 'Agricultura')}"></div>
<nav th:replace="~{agricultura/fragments :: tabs}"></nav>
<header class="agri-heading"><div><h2>Atualizar ocorr&ecirc;ncia</h2>
<a th:href="@{/sitio/agricultura/ocorrencias/{id}(id=${registro.resumo.id})}" th:text="${registro.resumo.titulo}"></a></div></header>
<form class="agri-form" th:action="@{${acao}}" method="post" th:object="${form}">
<div th:replace="~{agricultura/fragments :: errors}"></div>
<input type="hidden" th:field="*{versao}"><input type="hidden" th:field="*{chaveIdempotencia}">
<div class="agri-fields">
<div><label for="tipo" class="form-label">Tipo</label><select id="tipo" class="form-select" th:field="*{tipo}" required><option th:each="o : ${tipos}" th:value="${o}" th:text="${o.rotulo}"></option></select></div>
<div><label for="severidade" class="form-label">Severidade</label><select id="severidade" class="form-select" th:field="*{severidade}" required><option th:each="o : ${severidades}" th:value="${o}" th:text="${o.rotulo}"></option></select></div>
<div class="agri-full"><label for="tituloOcorrencia" class="form-label">T&iacute;tulo</label><input id="tituloOcorrencia" class="form-control" type="text" th:field="*{titulo}" maxlength="180" required></div>
<div class="agri-full"><label for="descricao" class="form-label">Descri&ccedil;&atilde;o atual</label><textarea id="descricao" class="form-control" th:field="*{descricao}" rows="4" maxlength="1000" required></textarea></div>
<div><label for="areaAfetadaHa" class="form-label">&Aacute;rea afetada (ha)</label><input id="areaAfetadaHa" class="form-control" type="number" th:field="*{areaAfetadaHa}" min="0.0001" step="0.0001"></div>
<div class="agri-full"><label for="agrofitCulturaIds" class="form-label">Refer&ecirc;ncias Agrofit locais</label><select id="agrofitCulturaIds" class="form-select" th:field="*{agrofitCulturaIds}" multiple size="4"><option th:each="o : ${agrofit}" th:value="${o.id}" th:text="${o.nome}"></option></select>
<p class="form-text" th:if="${#lists.isEmpty(agrofit)}">Nenhuma refer&ecirc;ncia Agrofit foi sincronizada localmente.</p>
<p class="form-text" th:if="${!#lists.isEmpty(agrofit)}">Dados locais para consulta; nenhuma recomenda&ccedil;&atilde;o de produto, dose ou aplica&ccedil;&atilde;o &eacute; gerada.</p></div>
<div class="agri-full"><label for="observacao" class="form-label">Observa&ccedil;&atilde;o</label><textarea id="observacao" class="form-control" th:field="*{observacao}" rows="3" maxlength="1000"></textarea></div>
<div class="agri-full"><label for="acompanhamento" class="form-label">Registro do acompanhamento</label><textarea id="acompanhamento" class="form-control" th:field="*{acompanhamento}" rows="4" maxlength="1500" required></textarea></div>
</div>
<div class="agri-form-actions"><a class="btn btn-outline-secondary" th:href="@{/sitio/agricultura/ocorrencias/{id}(id=${registro.resumo.id})}">Cancelar</a><button class="btn btn-success" type="submit"><i class="fa-solid fa-check me-2"></i>Salvar acompanhamento</button></div>
</form></main><th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block></body></html>
