<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio PRO - Minha Frota')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/frota.css}">
</head>
<body>
    <aside th:replace="~{fragments/sidebar :: sidebar('frota')}"></aside>

    <main class="main-content main-content-wide">
        <div class="container-fluid">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb bg-white p-3 rounded-3 shadow-sm">
                    <li class="breadcrumb-item">
                        <a th:href="@{/sitio/painel}" class="text-success text-decoration-none">
                            <i class="fa-solid fa-house me-1"></i> Home
                        </a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Minha Frota</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0"><i class="fa-solid fa-truck-pickup text-agro me-2"></i>Frota do Sítio</h2>
                <a th:href="@{/sitio/frota/novo}" class="btn btn-success shadow-sm px-4">
                    <i class="fa-solid fa-plus me-2"></i>Novo Veículo
                </a>
            </div>

            <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>

            <div class="row g-4">
                <div class="col-md-4" th:each="v : ${veiculos}">
                    <div class="card card-veiculo p-4 shadow-sm"
                         data-veiculo-card
                         th:data-id="${v.id}"
                         th:data-nome="${v.nome}"
                         th:data-historico="${v.ultimaConsultaFipe}">

                        <div class="d-flex justify-content-between mb-3">
                            <div class="icon-box"><i th:class="'fa-solid ' + ${v.icone}"></i></div>
                            <span class="badge bg-success-subtle text-success rounded-pill" th:text="${v.situacao}">Ativo</span>
                        </div>

                        <h4 class="fw-bold mb-1" th:text="${v.nome}">Palio Attractive</h4>
                        <p class="text-muted small mb-0">
                            <i class="fa-solid fa-barcode me-1"></i>
                            <span th:text="${v.placa}">ABC-1234</span>
                        </p>

                        <div class="row mt-4 border-top pt-3">
                            <div class="col-6 border-end text-center">
                                <small class="text-muted d-block small">KM ATUAL</small>
                                <strong class="fs-5" th:text="${v.kmAtual}">0.0</strong>
                            </div>
                            <div class="col-6 ps-3 text-center">
                                <small class="text-muted d-block small">VALOR FIPE</small>
                                <strong class="text-success fs-5"
                                        th:text="${v.valorFipe != null ? 'R$ ' + #numbers.formatDecimal(v.valorFipe, 1, 'POINT', 2, 'COMMA') : 'R$ 0,00'}">
                                </strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
    <script th:src="@{/js/frota.js}"></script>
</body>
</html>
