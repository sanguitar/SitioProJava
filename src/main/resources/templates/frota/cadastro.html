<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb bg-white p-3 rounded-3 shadow-sm">
        <li class="breadcrumb-item"><a th:href="@{/sitio/painel}" class="text-success text-decoration-none"><i class="fa-solid fa-house me-1"></i> Home</a></li>
        <li class="breadcrumb-item"><a th:href="@{/sitio/frota}" class="text-success text-decoration-none">Minha Frota</a></li>
        <li class="breadcrumb-item active">Novo Veículo</li>
    </ol>
</nav>

<div class="fipex-dark shadow-lg p-4" style="background: #1a1d21; color: white; border-radius: 15px;">
    <h4 class="mb-4"><i class="fa-solid fa-car-side me-2 text-primary"></i> Cadastro com Inteligência de Cache</h4>
    
    <form th:action="@{/sitio/frota/salvar}" th:object="${veiculo}" method="post" id="formCadastro">
        <input type="hidden" id="historicoFipeJson" th:field="*{ultimaConsultaFipe}">
        <input type="hidden" id="valorFipe" th:field="*{valorFipe}">

        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label small fw-bold">1. Tipo</label>
                <select id="tipo" th:field="*{tipo}" class="form-select bg-dark text-white border-secondary">
                    <option value="">Selecione...</option>
                    <option value="1">Carros</option>
                    <option value="2">Motos</option>
                    <option value="3">Caminhões</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">2. Marca</label>
                <select id="marca" th:field="*{marcaFipe}" class="form-select bg-dark text-white border-secondary" disabled></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">3. Modelo</label>
                <select id="modelo" th:field="*{modeloFipe}" class="form-select bg-dark text-white border-secondary" disabled></select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">4. Ano / Combustível</label>
                <select id="ano" th:field="*{anoModelo}" class="form-select bg-dark text-white border-secondary" disabled></select>
            </div>
        </div>

        <div id="secaoFinal" class="mt-4 pt-4 border-top border-secondary" style="display:none;">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Nome no Sistema</label>
                    <input type="text" th:field="*{nome}" id="nomeSugerido" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">KM Atual</label>
                    <input type="number" step="0.1" th:field="*{kmAtual}" class="form-control bg-dark text-white border-secondary">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow">
                        <i class="fa-solid fa-save me-2"></i>CADASTRAR VEÍCULO
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    const API_URL = "/api/fipe";

    // 1. Marcas
    document.getElementById('tipo').addEventListener('change', async function() {
        resetCampos(['marca', 'modelo', 'ano']);
        if (!this.value) return;
        
        const data = await fetch(`${API_URL}/marcas?tipo=${this.value}`).then(r => r.json());
        popularSelect('marca', data);
    });

    // 2. Modelos
    document.getElementById('marca').addEventListener('change', async function() {
        resetCampos(['modelo', 'ano']);
        const tipo = document.getElementById('tipo').value;
        const data = await fetch(`${API_URL}/modelos?tipo=${tipo}&marca=${this.value}`).then(r => r.json());
        popularSelect('modelo', data);
    });

    // 3. Anos (Passo extra fipeX)
    document.getElementById('modelo').addEventListener('change', async function() {
        resetCampos(['ano']);
        const tipo = document.getElementById('tipo').value;
        const marca = document.getElementById('marca').value;
        const data = await fetch(`${API_URL}/anos?tipo=${tipo}&marca=${marca}&modelo=${this.value}`).then(r => r.json());
        
        let html = '<option value="">Selecione o Ano...</option>';
        data.forEach(v => html += `<option value="${v.id}">${v.ano_modelo} - ${v.combustivel}</option>`);
        document.getElementById('ano').innerHTML = html;
        document.getElementById('ano').disabled = false;
    });

    // 4. Detalhes (Onde o Java Cache brilha)
    document.getElementById('ano').addEventListener('change', async function() {
        if (!this.value) return;
        
        const data = await fetch(`${API_URL}/detalhes/${this.value}`).then(r => r.json());
        
        // Preenche os campos para o Hibernate salvar
        document.getElementById('valorFipe').value = data.valor;
        document.getElementById('historicoFipeJson').value = data.historicoJson || JSON.stringify(data.historico);
        
        // Sugere o nome baseado no modelo selecionado
        const modeloText = document.getElementById('modelo').options[document.getElementById('modelo').selectedIndex].text;
        document.getElementById('nomeSugerido').value = modeloText;
        
        document.getElementById('secaoFinal').style.display = 'block';
    });

    // Funções auxiliares para evitar o LOOP
    function popularSelect(id, lista) {
        const el = document.getElementById(id);
        let html = '<option value="">Selecione...</option>';
        lista.forEach(i => html += `<option value="${i.id}">${i.nome}</option>`);
        el.innerHTML = html;
        el.disabled = false;
    }

    function resetCampos(ids) {
        ids.forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = '';
            el.disabled = true;
        });
        document.getElementById('secaoFinal').style.display = 'none';
    }
</script>
