<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Veículo')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/frota.css}">
</head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar('frota')}"></aside>
<main class="main-content main-content-wide">
    <div th:replace="~{fragments/ui :: topbar(${veiculoId == null ? 'Novo veículo' : 'Editar veículo'}, 'Veículos')}"></div>
    <nav aria-label="breadcrumb" class="module-breadcrumb"><ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a th:href="@{/sitio/painel}">Início</a></li>
        <li class="breadcrumb-item"><a th:href="@{/sitio/frota}">Frota</a></li>
        <li class="breadcrumb-item active" th:text="${veiculoId == null ? 'Novo' : 'Editar'}"></li>
    </ol></nav>
    <section class="fipex-card p-4">
        <h1 class="h4 mb-4"><i class="fa-solid fa-car-side me-2"></i>Dados do veículo</h1>
        <form th:action="${veiculoId == null ? '/sitio/frota/salvar' : '/sitio/frota/' + veiculoId}" th:object="${veiculoForm}" method="post" id="formCadastro">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{chaveIdempotencia}">
            <input type="hidden" th:field="*{versao}">
            <input type="hidden" id="marcaFipe" th:field="*{marcaFipe}">
            <input type="hidden" id="modeloFipe" th:field="*{modeloFipe}">
            <input type="hidden" id="anoModelo" th:field="*{anoModelo}">
            <input type="hidden" id="fipeReferenciaId" th:field="*{fipeReferenciaId}">
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p class="mb-0" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label">Nome</label><input type="text" th:field="*{nome}" class="form-control" required maxlength="100"></div>
                <div class="col-md-4"><label class="form-label">Placa</label><input type="text" th:field="*{placa}" class="form-control" maxlength="20"></div>
                <div class="col-md-4"><label class="form-label">Tipo FIPE</label><select id="tipo" th:field="*{tipo}" class="form-select" required><option value="">Selecione</option><option value="1">Carro</option><option value="2">Moto</option><option value="3">Caminhão</option></select></div>
                <div class="col-md-4"><label class="form-label">Marca FIPE</label><select id="marca" class="form-select" disabled><option th:text="*{marcaFipe != null ? marcaFipe : 'Selecione'}"></option></select></div>
                <div class="col-md-4"><label class="form-label">Modelo FIPE</label><select id="modelo" class="form-select" disabled><option th:text="*{modeloFipe != null ? modeloFipe : 'Selecione'}"></option></select></div>
                <div class="col-md-4"><label class="form-label">Ano / combustível</label><select id="ano" class="form-select" disabled><option th:text="*{anoModelo != null ? anoModelo : 'Selecione'}"></option></select></div>
                <div class="col-md-4"><label class="form-label">Tipo de medidor</label><select id="tipoMedidor" th:field="*{tipoMedidor}" class="form-select" required><option th:each="tipo : ${tiposMedidor}" th:value="${tipo}" th:text="${tipo.rotulo}"></option></select></div>
                <div class="col-md-4" data-km-group><label class="form-label">Quilometragem atual</label><input type="number" step="0.01" min="0" th:field="*{kmAtual}" class="form-control"></div>
                <div class="col-md-4" data-horimetro-group><label class="form-label">Horímetro atual</label><input type="number" step="0.01" min="0" th:field="*{horimetroAtual}" class="form-control"></div>
                <div class="col-12"><label class="form-label">Ativo patrimonial vinculado</label><select th:field="*{ativoPatrimonialId}" class="form-select"><option value="">Sem vínculo</option><option th:each="ativo : ${ativos}" th:value="${ativo.id}" th:text="${ativo.codigo + ' · ' + ativo.nome + ' · ' + ativo.tipo}"></option></select><div class="form-text">O vínculo sincroniza leituras com os planos de manutenção do ativo.</div></div>
            </div>
            <div class="form-actions mt-4"><a th:href="@{/sitio/frota}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk me-2"></i>Salvar</button></div>
        </form>
    </section>
    <div th:replace="~{fragments/ui :: appFooter}"></div>
</main>
<th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
<script th:src="@{/js/frota.js}"></script>
</body>
</html>
