<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Sítio Guaratinguetá - Login')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="security-body">
    <main class="login-shell">
        <section class="login-visual" aria-label="Identidade do Sítio Guaratinguetá">
            <div class="login-photo-placeholder">
                <img th:src="@{/brand/logo-horizontal-light.svg}" alt="Sítio Guaratinguetá" class="login-visual-logo">
                <div>
                    <span>Gestão rural profissional</span>
                    <strong>Natureza, rotina e dados no mesmo lugar.</strong>
                </div>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-brand">
                <img th:src="@{/brand/garca-symbol.svg}" alt="" aria-hidden="true">
                <div>
                    <h1>Sítio Guaratinguetá</h1>
                    <span>Acesse sua área de gestão</span>
                </div>
            </div>

            <div class="alert alert-danger" th:if="${param.error}">
                Login ou senha inválidos.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Logout realizado com sucesso.
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="username">Login</label>
                <input id="username" type="text" name="username" autocomplete="username" required autofocus>

                <label for="password">Senha</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>

                <button type="submit" class="btn btn-success fw-bold login-submit">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
                </button>
            </form>

            <footer class="login-footer">&copy; 2026 Sítio Guaratinguetá &bull; Desenvolvido por Sânderson</footer>
        </section>
    </main>

    <th:block th:replace="~{fragments/scripts :: commonScripts}"></th:block>
</body>
</html>
