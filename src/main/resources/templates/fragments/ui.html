<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar(titulo, contexto)" class="app-topbar">
    <div class="topbar-left">
        <button class="topbar-sidebar-toggle d-lg-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainSidebarNav" aria-controls="mainSidebarNav" aria-expanded="false"
                aria-label="Abrir menu principal">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="topbar-context">
            <span class="topbar-eyebrow" th:text="${contexto}">Contexto</span>
            <h1 class="topbar-title" th:text="${titulo}">Página</h1>
            <span class="topbar-subtitle">Sítio Guaratinguetá</span>
        </div>
    </div>

    <div class="topbar-actions" sec:authorize="isAuthenticated()">
        <button class="topbar-icon-button is-muted" type="button"
                title="Notificações futuras" aria-label="Notificações futuras" disabled>
            <i class="fa-regular fa-bell"></i>
        </button>
        <a th:href="@{/sitio/perfil}" class="topbar-icon-button" title="Minha conta" aria-label="Minha conta">
            <i class="fa-regular fa-id-card"></i>
        </a>
        <div class="topbar-user">
            <div class="topbar-avatar" aria-hidden="true">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="topbar-user-meta">
                <span class="topbar-user-name"
                      th:text="${#authentication.principal instanceof T(com.example.sitiopro.usuario.security.UsuarioPrincipal) ? #authentication.principal.nome : #authentication.name}">
                    Usuário
                </span>
                <span class="topbar-user-profile"
                      th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'ADMIN' : 'OPERADOR'}">
                    PERFIL
                </span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="topbar-logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="topbar-icon-button" title="Sair" aria-label="Sair">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </form>
    </div>
</header>

<th:block th:fragment="statusBadge(status)">
    <span class="status-badge-visual" th:classappend="${status.classe}" th:text="${status.rotulo}">PLANEJADO</span>
</th:block>

<th:block th:fragment="moduleHeader(modulo, statusPagina)">
    <section class="module-header">
        <div class="module-title-group">
            <div class="module-icon">
                <i th:class="'fa-solid ' + ${modulo.icon}"></i>
            </div>
            <div>
                <small class="module-group" th:text="${modulo.grupo}">Grupo</small>
                <h1 th:text="${modulo.titulo}">Funcionalidade</h1>
                <p th:text="${modulo.descricao}">Descrição curta.</p>
            </div>
        </div>
        <div th:replace="~{fragments/ui :: statusBadge(${statusPagina})}"></div>
    </section>
</th:block>

<th:block th:fragment="breadcrumbs(items)">
    <nav aria-label="breadcrumb" class="module-breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item" th:each="item : ${items}" th:classappend="${item.ativo} ? ' active'">
                <a th:if="${!item.ativo}" th:href="@{${item.rota}}" th:text="${item.rotulo}">Seção</a>
                <span th:if="${item.ativo}" th:text="${item.rotulo}">Atual</span>
            </li>
        </ol>
    </nav>
</th:block>

<footer th:fragment="appFooter" class="app-footer">
    <span>&copy; 2026 Sítio Guaratinguetá &bull; Desenvolvido por Sânderson</span>
</footer>
</body>
</html>
