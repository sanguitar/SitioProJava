services:
  nginx:
    image: nginx:1.28.3-alpine
    container_name: sitiopro-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sitiopro-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sitiopro-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-sitio_db}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
      DB_USERNAME: ${DB_USERNAME:-sitiopro_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      FLYWAY_USERNAME: ${FLYWAY_USERNAME:-sitiopro_migration}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?Defina FLYWAY_PASSWORD no arquivo .env}
    command:
      - /bin/bash
      - -c
      - |
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi

        wait_for_database() {
          for attempt in {1..60}; do
            if "$$SQLCMD" -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d master -Q "
              IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'$$DB_NAME')
                  SELECT 1;
              ELSE IF EXISTS (SELECT 1 FROM sys.databases WHERE name = N'$$DB_NAME' AND state_desc = N'ONLINE')
                  SELECT 1;
              ELSE
                  THROW 51000, 'Database is not online yet.', 1;
              " >/dev/null; then
              return 0
            fi

            sleep 5
          done

          echo "Database $$DB_NAME did not become available in time."
          return 1
        }

        wait_for_database

        "$$SQLCMD" -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d master -Q "
          IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'$$DB_NAME') CREATE DATABASE [$$DB_NAME];

          IF SUSER_ID(N'$$DB_USERNAME') IS NULL
              CREATE LOGIN [$$DB_USERNAME] WITH PASSWORD = N'$$DB_PASSWORD', CHECK_POLICY = ON, CHECK_EXPIRATION = OFF;
          ELSE
              ALTER LOGIN [$$DB_USERNAME] WITH PASSWORD = N'$$DB_PASSWORD';
          ALTER LOGIN [$$DB_USERNAME] ENABLE;

          IF SUSER_ID(N'$$FLYWAY_USERNAME') IS NULL
              CREATE LOGIN [$$FLYWAY_USERNAME] WITH PASSWORD = N'$$FLYWAY_PASSWORD', CHECK_POLICY = ON, CHECK_EXPIRATION = OFF;
          ELSE
              ALTER LOGIN [$$FLYWAY_USERNAME] WITH PASSWORD = N'$$FLYWAY_PASSWORD';
          ALTER LOGIN [$$FLYWAY_USERNAME] ENABLE;
          "

        wait_for_database

        users_ready=false
        for attempt in {1..60}; do
          if "$$SQLCMD" -b -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d master -Q "
            USE [$$DB_NAME];

            IF USER_ID(N'$$DB_USERNAME') IS NULL CREATE USER [$$DB_USERNAME] FOR LOGIN [$$DB_USERNAME];
            IF IS_ROLEMEMBER(N'db_datareader', N'$$DB_USERNAME') = 0 ALTER ROLE db_datareader ADD MEMBER [$$DB_USERNAME];
            IF IS_ROLEMEMBER(N'db_datawriter', N'$$DB_USERNAME') = 0 ALTER ROLE db_datawriter ADD MEMBER [$$DB_USERNAME];

            IF USER_ID(N'$$FLYWAY_USERNAME') IS NULL CREATE USER [$$FLYWAY_USERNAME] FOR LOGIN [$$FLYWAY_USERNAME];
            IF IS_ROLEMEMBER(N'db_owner', N'$$FLYWAY_USERNAME') = 0 ALTER ROLE db_owner ADD MEMBER [$$FLYWAY_USERNAME];
            "; then
            users_ready=true
            break
          fi

          sleep 5
        done

        if [ "$$users_ready" != "true" ]; then
          echo "Database users could not be configured in time."
          exit 1
        fi
    restart: "no"
    networks:
      - backend

  redis:
    image: redis:8.2.9-alpine
    container_name: sitiopro-redis
    profiles:
      - cache
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - /usr/local/etc/redis/sitiopro-entrypoint.sh
    volumes:
      - ./infra/redis/entrypoint.sh:/usr/local/etc/redis/sitiopro-entrypoint.sh:ro
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --user \"$${REDIS_USERNAME}\" ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitiopro-app
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8083
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-sitio_db}
      DB_USERNAME: ${DB_USERNAME:-sitiopro_app}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      FLYWAY_USERNAME: ${FLYWAY_USERNAME:-sitiopro_migration}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?Defina FLYWAY_PASSWORD no arquivo .env}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-native}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SITIOPRO_ENVIRONMENT: ${SITIOPRO_ENVIRONMENT:-dev}
      SITIOPRO_LOG_FILE: ${SITIOPRO_LOG_FILE:-/tmp/sitiopro/app.ecs.json}
      SITIOPRO_LOG_LEVEL: ${SITIOPRO_LOG_LEVEL:-INFO}
      HIBERNATE_SQL_LOG_LEVEL: ${HIBERNATE_SQL_LOG_LEVEL:-WARN}
      HIBERNATE_BIND_LOG_LEVEL: ${HIBERNATE_BIND_LOG_LEVEL:-WARN}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      CRIACAO_AVES_MORTALIDADE_ALERTA_PERCENTUAL: ${CRIACAO_AVES_MORTALIDADE_ALERTA_PERCENTUAL:-5.0}
      CRIACAO_AVES_MORTALIDADE_PERIODO_DIAS: ${CRIACAO_AVES_MORTALIDADE_PERIODO_DIAS:-7}
      CRIACAO_AVES_ECLOSAO_PROXIMA_DIAS: ${CRIACAO_AVES_ECLOSAO_PROXIMA_DIAS:-2}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-500ms}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-1s}
      REDIS_RETRY_AFTER: ${REDIS_RETRY_AFTER:-10s}
      CACHE_TTL_CLIMA_RESUMO: ${CACHE_TTL_CLIMA_RESUMO:-5m}
      CACHE_TTL_INTEGRACOES_STATUS: ${CACHE_TTL_INTEGRACOES_STATUS:-30s}
      CACHE_TTL_AGROFIT_CULTURAS: ${CACHE_TTL_AGROFIT_CULTURAS:-12h}
      SITIOPRO_OBSERVABILITY_ENABLED: ${SITIOPRO_OBSERVABILITY_ENABLED:-false}
      SITIOPRO_OBSERVABILITY_APM_SERVER_URL: ${SITIOPRO_OBSERVABILITY_APM_SERVER_URL:-http://apm-server:8200}
      SITIOPRO_INITIAL_ADMIN_ENABLED: ${SITIOPRO_INITIAL_ADMIN_ENABLED:-false}
      SITIOPRO_INITIAL_ADMIN_LOGIN: ${SITIOPRO_INITIAL_ADMIN_LOGIN:-}
      SITIOPRO_INITIAL_ADMIN_PASSWORD: ${SITIOPRO_INITIAL_ADMIN_PASSWORD:-}
      SITIOPRO_INITIAL_ADMIN_NAME: ${SITIOPRO_INITIAL_ADMIN_NAME:-}
      SITIOPRO_TASKS_SCHEDULER_ENABLED: ${SITIOPRO_TASKS_SCHEDULER_ENABLED:-true}
      SITIOPRO_ALERTS_INTERVAL: ${SITIOPRO_ALERTS_INTERVAL:-PT5M}
      SITIOPRO_TASK_RECURRENCES_INTERVAL: ${SITIOPRO_TASK_RECURRENCES_INTERVAL:-PT1M}
      SITIOPRO_TASKS_INITIAL_DELAY: ${SITIOPRO_TASKS_INITIAL_DELAY:-PT30S}
      SITIOPRO_LOT_EXPIRY_WARNING_DAYS: ${SITIOPRO_LOT_EXPIRY_WARNING_DAYS:-30}
      SITIOPRO_RAIN_24H_ALERT_MM: ${SITIOPRO_RAIN_24H_ALERT_MM:-50.0}
      SITIOPRO_TASK_RECURRENCES_BATCH_SIZE: ${SITIOPRO_TASK_RECURRENCES_BATCH_SIZE:-100}
      SITIOPRO_INTEGRATIONS_ZONE: ${SITIOPRO_INTEGRATIONS_ZONE:-UTC}
      SITIOPRO_OPEN_METEO_ENABLED: ${SITIOPRO_OPEN_METEO_ENABLED:-false}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      SITIO_LATITUDE: ${SITIO_LATITUDE:-}
      SITIO_NOME_PROPRIEDADE: ${SITIO_NOME_PROPRIEDADE:-Sítio Guaratinguetá}
      CRIACAO_AVES_GALINHA_INCUBACAO_DIAS: ${CRIACAO_AVES_GALINHA_INCUBACAO_DIAS:-21}
      SITIO_LONGITUDE: ${SITIO_LONGITUDE:-}
      SITIO_TIMEZONE: ${SITIO_TIMEZONE:-}
      SITIOPRO_CLIMATE_CONTEXT: ${SITIOPRO_CLIMATE_CONTEXT:-principal}
      OPEN_METEO_CRON: ${OPEN_METEO_CRON:-0 17 */3 * * *}
      OPEN_METEO_CONNECT_TIMEOUT: ${OPEN_METEO_CONNECT_TIMEOUT:-3s}
      OPEN_METEO_READ_TIMEOUT: ${OPEN_METEO_READ_TIMEOUT:-8s}
      OPEN_METEO_STALE_AFTER: ${OPEN_METEO_STALE_AFTER:-6h}
      OPEN_METEO_FORECAST_DAYS: ${OPEN_METEO_FORECAST_DAYS:-7}
      OPEN_METEO_RETENTION_DAYS: ${OPEN_METEO_RETENTION_DAYS:-30}
      SITIOPRO_EMBRAPA_AGROFIT_ENABLED: ${SITIOPRO_EMBRAPA_AGROFIT_ENABLED:-false}
      EMBRAPA_AGROFIT_BASE_URL: ${EMBRAPA_AGROFIT_BASE_URL:-https://api.cnptia.embrapa.br/agrofit/v1}
      EMBRAPA_AGROFIT_TOKEN: ${EMBRAPA_AGROFIT_TOKEN:-}
      EMBRAPA_AGROFIT_CRON: ${EMBRAPA_AGROFIT_CRON:-0 29 3 * * MON}
      EMBRAPA_AGROFIT_CONNECT_TIMEOUT: ${EMBRAPA_AGROFIT_CONNECT_TIMEOUT:-3s}
      EMBRAPA_AGROFIT_READ_TIMEOUT: ${EMBRAPA_AGROFIT_READ_TIMEOUT:-10s}
      EMBRAPA_AGROFIT_STALE_AFTER: ${EMBRAPA_AGROFIT_STALE_AFTER:-9d}
      EMBRAPA_AGROFIT_MAX_PAGES: ${EMBRAPA_AGROFIT_MAX_PAGES:-1}
    expose:
      - "8083"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  sqlserver_data:
  nginx_logs:

networks:
  frontend:
  backend:
