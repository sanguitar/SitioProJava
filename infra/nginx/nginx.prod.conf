worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    map $http_x_request_id $sitiopro_request_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
    }

    log_format ecs_json escape=json
        '{'
        '"@timestamp":"$time_iso8601",'
        '"ecs.version":"1.12.0",'
        '"service.name":"sitiopro-nginx",'
        '"service.environment":"prod",'
        '"event.dataset":"nginx.access",'
        '"event.action":"http_request",'
        '"request.id":"$sitiopro_request_id",'
        '"client.ip":"$remote_addr",'
        '"http.request.method":"$request_method",'
        '"url.path":"$uri",'
        '"http.response.status_code":$status,'
        '"http.response.body.bytes":$body_bytes_sent,'
        '"nginx.access.request_time":$request_time,'
        '"upstream.address":"$upstream_addr",'
        '"upstream.response.time":"$upstream_response_time",'
        '"user_agent.original":"$http_user_agent",'
        '"http.request.referrer":"$http_referer"'
        '}';

    access_log /var/log/nginx/sitiopro-access.log ecs_json;
    error_log /var/log/nginx/sitiopro-error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        client_max_body_size 10m;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

        set $sitiopro_app_upstream http://app:8083;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = / {
            return 302 /sitio/painel;
        }

        location / {
            proxy_pass $sitiopro_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $sitiopro_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $sitiopro_request_id always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
            proxy_redirect off;
        }
    }
}
